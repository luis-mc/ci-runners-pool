name: Parity

# Note (HND26, owner decision): the canonical parity run is in the private
# comics-organizer repository (.github/workflows/crsp-parity.yml), so this
# public repository keeps no self-hosted runners. This workflow stays as the
# reference of the check and is not the run that counts.

# Parity gate against the old runner pool (docs/architecture/parity-plan.md,
# section 6, release v0.7.0). It checks the crsp pool on a self-hosted runner,
# writes the parity report and uploads it as the artifact `parity-report`
# (a stable name: artifact-prune.yml keeps the newest one).
#
# `soak` = none runs the pool checks only. `soak` = dry-run also judges a fake
# soak, to prove the report logic; a dry run never counts for the gate. The
# real soak is not started here (parity-plan P1 to P6; the move runbook).
#
# Access (CRSP134). The check signs in from three values the web console
# writes to this repository: the secret CRSP_ACCESS and the variables CRSP_URL
# and CRSP_CA_FINGERPRINT. In the console, Settings, Access for CI, pick this
# repository and press "Set up parity for this repository". Nobody copies a
# value, and no `crsp login` is needed on the runner.
on:
  workflow_dispatch:
    inputs:
      soak:
        description: 'none: pool checks only. dry-run: also judge a fake soak.'
        type: choice
        options: [none, dry-run]
        default: none
  schedule:
    - cron: '17 2 * * *'

concurrency:
  group: parity
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  parity:
    name: parity checks
    # The pool's own runner labels, as a JSON list in the repository variable
    # PARITY_RUNS_ON. The default is any self-hosted Linux runner.
    runs-on: ${{ fromJSON(vars.PARITY_RUNS_ON || '["self-hosted","linux"]') }}
    timeout-minutes: 30
    env:
      REPORT_DIR: parity-out
    steps:
      - name: Check the access is set up
        id: access
        shell: bash
        env:
          CRSP_URL: ${{ vars.CRSP_URL }}
          CRSP_CA_FINGERPRINT: ${{ vars.CRSP_CA_FINGERPRINT }}
          CRSP_ACCESS: ${{ secrets.CRSP_ACCESS }}
        run: |
          missing=""
          for name in CRSP_URL CRSP_CA_FINGERPRINT CRSP_ACCESS; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Parity access is not set up::Missing:${missing}. In the crsp web console open Settings, Access for CI, pick this repository and press 'Set up parity for this repository'. It writes CRSP_ACCESS, CRSP_URL and CRSP_CA_FINGERPRINT here for you. There is nothing to copy."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Build crsp
        run: go build -o "$RUNNER_TEMP/crsp" ./cmd/crsp
      - name: Check the pool
        id: check
        # The CLI signs in from the three values below (cli R5.60): no login
        # context on the runner, and the CA fingerprint is pinned. A failed
        # check fails the step, but the report is still uploaded below.
        continue-on-error: true
        env:
          CRSP_URL: ${{ vars.CRSP_URL }}
          CRSP_CA_FINGERPRINT: ${{ vars.CRSP_CA_FINGERPRINT }}
          CRSP_ACCESS: ${{ secrets.CRSP_ACCESS }}
        run: |
          mkdir -p "$REPORT_DIR"
          "$RUNNER_TEMP/crsp" parity check --out "$REPORT_DIR/parity-report.json"
      - name: Judge a fake soak (dry run)
        id: soak
        if: ${{ steps.access.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.soak == 'dry-run' }}
        continue-on-error: true
        run: |
          mkdir -p "$REPORT_DIR"
          "$RUNNER_TEMP/crsp" parity soak --dry-run --jobs 5 --duration 1h --p95 1m \
            --out "$REPORT_DIR/parity-soak-dry-run.json"
      - name: Summary
        if: ${{ always() }}
        run: |
          for f in "$REPORT_DIR"/*.json; do
            [ -f "$f" ] || continue
            "$RUNNER_TEMP/crsp" parity report --markdown "$f" >> "$GITHUB_STEP_SUMMARY" || true
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: parity-report
          path: parity-out/
          if-no-files-found: warn
          overwrite: true
          retention-days: 30
      - name: Fail when the report did not pass
        if: ${{ always() }}
        # Says the real cause (CRSP141). Everything it needs comes in as
        # environment, so it still runs when every earlier step was skipped:
        # it reads no file of the checkout.
        env:
          ACCESS_OUTCOME: ${{ steps.access.outcome }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          SOAK_OUTCOME: ${{ steps.soak.outcome }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          case "$ACCESS_OUTCOME" in
            success) ;;
            failure)
              echo "The parity access is not set up. In the crsp web console open Settings, Access for CI, pick this repository and press 'Set up parity for this repository'."
              exit 1
              ;;
            *)
              # The access step did not run (skipped or cancelled, or no outcome at all).
              why="The cause is not known here; open the log of this job and read the first step that did not run."
              if [ "$JOB_STATUS" = "cancelled" ]; then
                why="The run was cancelled or timed out (timeout-minutes is 30), for example while it waited for a free slot in the self-hosted pool."
              fi
              echo "::error title=Parity did not reach the checks::The job did not reach the checks: the access step was ${ACCESS_OUTCOME:-not run}. ${why} This says nothing about the parity access; run the workflow again when the pool has a free slot."
              exit 1
              ;;
          esac
          if [ "$CHECK_OUTCOME" != "success" ] || [ "$SOAK_OUTCOME" = "failure" ]; then
            echo "The parity report did not pass. See the summary and the parity-report artifact."
            exit 1
          fi
