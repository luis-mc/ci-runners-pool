name: Release

# push to main  -> the `edge` pre-release is replaced with this commit's build.
#                  The owner installs edge on their own pool first (staging).
# tag v*        -> a stable release with the same assets (production).
#
# Assets: crsp-<os>-<arch>.tar.gz (linux, darwin) or .zip (windows),
# crsp-windows-<arch>.msi (the Windows installer, WiX v5, built on windows-latest),
# SHA256SUMS, and a build provenance attestation for each.
# Authenticode signing and Apple notarization come later (milestone 8).
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:

concurrency:
  # A release is never cancelled half way.
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      value: ${{ steps.v.outputs.value }}
    steps:
      - id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            echo "value=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=edge-${SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.value }}
      artifact-prefix: release-

  # The Windows installers (operations R5.7): one MSI per architecture, built
  # from the crsp.exe the build job made, stamped with the release version.
  msi:
    name: msi ${{ matrix.goarch }}
    needs: [version, build]
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: amd64, arch: x64 }
          - { goarch: arm64, arch: arm64 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-windows-${{ matrix.goarch }}
          path: binaries
      - name: Build the MSI
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.value }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          # An edge build is stamped with the next patch after the latest stable tag.
          $edgeBase = '0.1.0'
          $last = git tag --list 'v*' --sort=-v:refname | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } | Select-Object -First 1
          if ($last -match '^v(\d+)\.(\d+)\.(\d+)$') { $edgeBase = "$($Matches[1]).$($Matches[2]).$([int]$Matches[3] + 1)" }
          ./installer/build.ps1 -Arch ${{ matrix.arch }} -Exe binaries/crsp.exe -Version $env:VERSION `
            -EdgeBase $edgeBase -Build ([int]$env:RUN_NUMBER % 65535) -Out installer/out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # Stable name, no version or run number, so artifact-prune.yml keeps the newest.
          name: msi-windows-${{ matrix.goarch }}
          path: installer/out/crsp-windows-${{ matrix.goarch }}.msi
          if-no-files-found: error

  publish:
    name: publish
    needs: [build, msi]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: binaries
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: msi-windows-*
          merge-multiple: true
          path: msi

      - name: Package and checksum
        run: |
          set -euo pipefail
          mkdir -p dist
          for dir in binaries/release-*; do
            target="${dir#binaries/release-}"          # e.g. linux-amd64
            stage="stage/crsp-${target}"
            rm -rf stage && mkdir -p "$stage"
            cp "$dir"/crsp* "$stage/"
            cp LICENSE README.md "$stage/"
            chmod +x "$stage"/crsp* || true
            case "$target" in
              windows-*) (cd stage && zip -qr "../dist/crsp-${target}.zip" "crsp-${target}") ;;
              *)         tar -C stage -czf "dist/crsp-${target}.tar.gz" "crsp-${target}" ;;
            esac
          done
          cp msi/crsp-windows-amd64.msi msi/crsp-windows-arm64.msi dist/
          count=$(find dist -type f | wc -l)
          [ "$count" -eq 8 ] || { echo "::error::expected 6 archives and 2 MSIs, found $count"; exit 1; }
          (cd dist && sha256sum crsp-* > SHA256SUMS)
          cat dist/SHA256SUMS

      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/crsp-*

      - name: Publish edge pre-release (main)
        if: ${{ github.ref_type == 'branch' }}
        env:
          SHA: ${{ github.sha }}
        run: |
          gh release delete edge --cleanup-tag --yes || true
          gh release create edge dist/* \
            --prerelease \
            --target "$SHA" \
            --title "Edge (${SHA:0:7})" \
            --notes "Automatic build of main at ${SHA}. Not a stable release."

      - name: Publish stable release (tag)
        if: ${{ github.ref_type == 'tag' }}
        env:
          TAG: ${{ github.ref_name }}
        run: |
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          # shellcheck disable=SC2086
          gh release create "$TAG" dist/* --verify-tag --generate-notes $flags
