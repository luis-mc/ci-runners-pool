# Lint and the STACKSPEC 3.2 / 3.3 boundary check in one invocation.
# depguard works on import paths, which is the granularity the layer graph uses.

version: '2'

run:
  timeout: 5m

formatters:
  enable:
    - gofmt

linters:
  enable:
    - depguard # 3.2 layer boundaries, 3.3 adapter confinement
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - noctx
    - rowserrcheck
    - sqlclosecheck

  settings:
    depguard:
      rules:
        # 3.2: the store package is the only one that imports the database
        # driver, database/sql or the migration tool.
        driver-confinement:
          files: ['**', '!**/internal/store/**']
          deny:
            - pkg: 'database/sql'
              desc: 'only internal/store may use database/sql (3.2)'
            - pkg: 'modernc.org/sqlite'
              desc: 'only internal/store may import the SQLite driver (3.2)'
            - pkg: 'github.com/pressly/goose'
              desc: 'only internal/store may run migrations (3.2)'

        # 3.2: the API reaches data through interfaces it declares itself.
        api-no-store:
          files: ['**/internal/api/**']
          deny:
            - pkg: 'github.com/luis-mc/ci-runners-pool/internal/store'
              desc: 'internal/api must depend on an interface, not on internal/store (3.2)'

        # 3.3: one adapter module per external service SDK. Add an entry when an
        # SDK is adopted; the adapter package is created then, not before.
        github-confinement:
          files: ['**', '!**/internal/github/**']
          deny:
            - pkg: 'github.com/google/go-github'
              desc: 'the GitHub SDK belongs only in internal/github (3.3)'
            - pkg: 'github.com/actions/scaleset'
              desc: 'the scale set client belongs only in internal/github (3.3)'

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
