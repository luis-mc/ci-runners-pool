openapi: 3.1.0
info:
  title: CI Runners Shared Pool API
  version: 0.1.0
  description: >-
    Controller API, milestone 1 contract (CRSP17). Every operation declares
    `x-auth` (public, user, admin or owner) and `x-rate-limit` (STACKSPEC 11.1);
    the route-coverage test in internal/api fails otherwise. `user` means any
    signed-in user (the viewer role and up). A request that changes something
    carries the session's CSRF token in `X-CSRF-Token` and must come from the
    console's own origin (web-console R6.2). A CLI token in
    `Authorization: Bearer` is accepted wherever a session is (github-integration
    R5.15). Every error uses the ErrorEnvelope. Stable error codes: bad_request,
    unauthenticated, session_expired, forbidden, not_found, conflict,
    rate_limited, needs_confirmation, github_unavailable, not_implemented,
    internal, unavailable.
servers:
  - url: /
tags:
  - name: health
  - name: setup
    description: First run (github-integration R5.1 to R5.6)
  - name: auth
    description: Sign-in, sessions, CLI tokens, tray links (github-integration R5.8 to R5.16, tray R5.6 to R5.10)
  - name: users
    description: Users, roles and preferences (github-integration R5.10 to R5.12, web-console 4.9)
  - name: repositories
    description: Installations, repositories, policies, variables (github-integration R5.17 to R5.30)
  - name: machines
    description: Machines, join codes, settings, drain (machines R5.1 to R5.52)
  - name: runners
    description: Runners and plans (runners R5.1 to R5.7)
  - name: jobs
    description: Queue, slots and history (scheduling, observability R5.7 to R5.12)
  - name: live
    description: Overview and the event stream (observability R5.1 to R5.6)
  - name: doctor
    description: Doctor runs and findings (doctor 7.1)
  - name: settings
    description: Controller settings and the audit log (observability R5.24 to R5.32)
  - name: backups
    description: Backup, restore and drill (operations R5.21 to R5.27)
  - name: images
    description: Images and tool layers (runners R5.32 to R5.35, web-console R5.25)
  - name: caches
    description: Caches per machine (caches R5.8 to R5.14, web-console R5.25)
  - name: notifications
    description: Notification channels (notifications R5.7 to R5.9)
  - name: update
    description: Self-update and service restart with drain (operations R5.11 to R5.18, tray R5.15 to R5.18)
  - name: webhooks
    description: GitHub webhook intake (github-integration R5.36)
paths:
  /healthz:
    get:
      operationId: getHealth
      x-cli: none
      x-cli-reason: 'A probe for load balancers and the tray, not an action of a person.'
      tags: [health]
      summary: Liveness and database check
      x-auth: public
      x-rate-limit: 60/minute/ip
      responses:
        '200':
          description: The controller is up and its database answers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: The controller is up but a dependency is down.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  # ---------------------------------------------------------------- setup
  /api/v1/setup:
    get:
      operationId: getSetupState
      x-cli: none
      x-cli-reason: 'Browser or GitHub entry point; the CLI signs in with the device flow instead.'
      tags: [setup]
      summary: First-run state; what the setup page shows
      description: github-integration R5.1, web-console R5.14 and R5.15.
      x-auth: public
      x-rate-limit: 60/minute/ip
      responses:
        '200':
          description: The first-run state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupState'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/setup/redeem:
    post:
      operationId: redeemSetupLink
      x-cli: none
      x-cli-reason: 'Browser or GitHub entry point; the CLI signs in with the device flow instead.'
      tags: [setup]
      summary: Trade a one-time setup code for a setup cookie
      description: >-
        github-integration R5.1, web-console R5.14. The code works once and
        expires. The answer sets an HttpOnly setup cookie.
      x-auth: public
      x-rate-limit: 10/minute/ip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemSetupLinkRequest'
      responses:
        '200':
          description: The code was good; the setup cookie is set.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupState'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/setup/github-app:
    post:
      operationId: startAppManifest
      x-cli: none
      x-cli-reason: 'Browser or GitHub entry point; the CLI signs in with the device flow instead.'
      tags: [setup]
      summary: Start GitHub's App manifest flow
      description: >-
        github-integration R5.2 and R5.4. Needs the setup cookie. Returns the
        manifest and the GitHub URL the browser posts it to.
      x-auth: public
      x-rate-limit: 10/minute/ip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartAppManifestRequest'
      responses:
        '200':
          description: The manifest form to post to GitHub.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppManifestForm'
        default:
          $ref: '#/components/responses/Error'
  /auth/github/app-created:
    get:
      operationId: completeAppManifest
      x-cli: none
      x-cli-reason: 'Browser or GitHub entry point; the CLI signs in with the device flow instead.'
      tags: [setup]
      summary: GitHub's redirect after the App is created
      description: >-
        github-integration R5.3. Trades the code once through
        `POST /app-manifests/{code}/conversions`; secrets go to the OS secret
        store, never the database. Redirects to the setup page.
      x-auth: public
      x-rate-limit: 10/minute/ip
      parameters:
        - $ref: '#/components/parameters/OAuthCode'
        - $ref: '#/components/parameters/OAuthState'
      responses:
        '302':
          $ref: '#/components/responses/Redirect'
        default:
          $ref: '#/components/responses/Error'

  # ---------------------------------------------------------------- auth
  /auth/github/login:
    get:
      operationId: startSignIn
      x-cli: none
      x-cli-reason: 'Browser or GitHub entry point; the CLI signs in with the device flow instead.'
      tags: [auth]
      summary: Start web sign-in with the App's user OAuth flow
      description: >-
        github-integration R5.8. Sets a random state and a PKCE verifier and
        redirects to GitHub. `return_to` must be a same-origin path
        (web-console R5.9). `bind_tray` binds this GitHub user to the calling
        OS user of the tray (owner decision for M1, tray R5.6).
      x-auth: public
      x-rate-limit: 20/minute/ip
      parameters:
        - name: return_to
          in: query
          required: false
          schema:
            type: string
            example: /machines
        - name: bind_tray
          in: query
          required: false
          description: A one-time tray binding code from the local channel.
          schema:
            type: string
      responses:
        '302':
          $ref: '#/components/responses/Redirect'
        default:
          $ref: '#/components/responses/Error'
  /auth/github/callback:
    get:
      operationId: completeSignIn
      x-cli: none
      x-cli-reason: 'Browser or GitHub entry point; the CLI signs in with the device flow instead.'
      tags: [auth]
      summary: GitHub OAuth callback; makes the session
      description: >-
        github-integration R5.8 to R5.10 and R5.13. Checks state and PKCE,
        resolves the GitHub user id, makes the session cookie and redirects to
        the kept path. A user not on the list gets the no-access page.
      x-auth: public
      x-rate-limit: 20/minute/ip
      parameters:
        - $ref: '#/components/parameters/OAuthCode'
        - $ref: '#/components/parameters/OAuthState'
      responses:
        '302':
          $ref: '#/components/responses/Redirect'
        default:
          $ref: '#/components/responses/Error'
  /auth/link:
    get:
      operationId: redeemTrayLink
      x-cli: none
      x-cli-reason: 'Browser or GitHub entry point; the CLI signs in with the device flow instead.'
      tags: [auth]
      summary: Sign in from a one-time tray link
      description: >-
        tray R5.7 and R6.1. The code is 128 random bits, valid 60 seconds,
        usable once, stored only as a hash. Marks it used in the transaction
        that makes the session, then redirects to a URL without the code.
      x-auth: public
      x-rate-limit: 20/minute/ip
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
      responses:
        '302':
          $ref: '#/components/responses/Redirect'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/auth/cli/config:
    get:
      operationId: getCliLoginConfig
      tags: [auth]
      summary: What the CLI needs to start GitHub's device flow
      description: github-integration R5.14. The App's client id is public.
      x-auth: public
      x-rate-limit: 60/minute/ip
      responses:
        '200':
          description: Device flow settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliLoginConfig'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/auth/cli:
    post:
      operationId: exchangeCliToken
      tags: [auth]
      summary: Trade a device-flow GitHub user token for a CLI token
      description: >-
        github-integration R5.14 and R5.15. The controller checks the GitHub
        token, drops it, and returns its own CLI token once. The token expires
        after 30 days.
      x-auth: public
      x-rate-limit: 10/minute/ip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeCliTokenRequest'
      responses:
        '201':
          description: The CLI token. Shown once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliTokenCreated'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/auth/cli/tokens:
    get:
      operationId: listCliTokens
      x-cli: none
      x-cli-reason: 'Later: remaining console screens get commands in their own task (cli open question 7).'
      tags: [auth]
      summary: List CLI tokens (own; every user's for the owner)
      description: github-integration R5.15.
      x-auth: user
      x-rate-limit: 600/minute/user
      responses:
        '200':
          description: The tokens, without their values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliTokenList'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/auth/cli/tokens/{tokenId}:
    delete:
      operationId: revokeCliToken
      tags: [auth]
      summary: Revoke a CLI token
      description: github-integration R5.15. The owner or the token's user.
      x-auth: user
      x-rate-limit: 60/minute/user
      parameters:
        - $ref: '#/components/parameters/TokenId'
      responses:
        '204':
          description: Revoked.
        default:
          $ref: '#/components/responses/Error'
  /api/v1/auth/logout:
    post:
      operationId: signOut
      x-cli: none
      x-cli-reason: 'Later: remaining console screens get commands in their own task (cli open question 7).'
      tags: [auth]
      summary: End this session
      description: web-console R5.12. Sessions end only at sign-out (owner decision for M1).
      x-auth: user
      x-rate-limit: 60/minute/user
      responses:
        '204':
          description: The session ended; the cookie is cleared.
        default:
          $ref: '#/components/responses/Error'
  /api/v1/auth/console-links:
    post:
      operationId: createConsoleLink
      tags: [auth]
      summary: Make a one-time link that signs the caller in to the web console
      description: >-
        cli R5.9 (added by CRSP25). The link carries a code of 128 random bits,
        valid 60 seconds, usable once, redeemed by redeemTrayLink. The caller
        must be signed in; the link gives the same user and role.
      x-auth: user
      x-rate-limit: 20/minute/user
      responses:
        '201':
          description: The link. Shown once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleLink'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/me:
    get:
      operationId: getSession
      x-cli: none
      x-cli-reason: 'Later: remaining console screens get commands in their own task (cli open question 7).'
      tags: [auth]
      summary: The signed-in user, role and CSRF token
      description: web-console 4.1, github-integration R5.9 and R5.12.
      x-auth: user
      x-rate-limit: 600/minute/user
      responses:
        '200':
          description: The session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        default:
          $ref: '#/components/responses/Error'

  # ---------------------------------------------------------------- users
  /api/v1/me/preferences:
    get:
      operationId: getPreferences
      x-cli: none
      x-cli-reason: 'Later: remaining console screens get commands in their own task (cli open question 7).'
      tags: [users]
      summary: The user's own view preferences
      description: web-console 4.9 Appearance (UX-60).
      x-auth: user
      x-rate-limit: 600/minute/user
      responses:
        '200':
          description: The preferences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updatePreferences
      x-cli: none
      x-cli-reason: 'Later: remaining console screens get commands in their own task (cli open question 7).'
      tags: [users]
      summary: Save the user's own view preferences
      x-auth: user
      x-rate-limit: 60/minute/user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Preferences'
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/users:
    get:
      operationId: listUsers
      x-cli: none
      x-cli-reason: 'Later: remaining console screens get commands in their own task (cli open question 7).'
      tags: [users]
      summary: Users allowed to sign in, with their roles
      description: github-integration R5.11, web-console R5.28.
      x-auth: owner
      x-rate-limit: 600/minute/user
      responses:
        '200':
          description: The users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: addUser
      x-cli: none
      x-cli-reason: 'Later: remaining console screens get commands in their own task (cli open question 7).'
      tags: [users]
      summary: Allow a GitHub login as admin or viewer
      description: github-integration R5.11. The login is resolved to a user id when added.
      x-auth: owner
      x-rate-limit: 60/minute/user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddUserRequest'
      responses:
        '201':
          description: Added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/users/{userId}:
    patch:
      operationId: updateUserRole
      x-cli: none
      x-cli-reason: 'Later: remaining console screens get commands in their own task (cli open question 7).'
      tags: [users]
      summary: Change a user's role
      description: >-
        github-integration R5.10 and R5.12. There is always exactly one owner;
        handing over ownership names both users and needs `confirm`.
      x-auth: owner
      x-rate-limit: 60/minute/user
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRoleRequest'
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: removeUser
      x-cli: none
      x-cli-reason: 'Later: remaining console screens get commands in their own task (cli open question 7).'
      tags: [users]
      summary: Remove a user; ends their sessions and CLI tokens
      description: web-console R5.28. The owner cannot remove themselves.
      x-auth: owner
      x-rate-limit: 60/minute/user
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Removed.
        default:
          $ref: '#/components/responses/Error'

  # ---------------------------------------------------------------- repositories
  /api/v1/github/installations:
    get:
      operationId: listInstallations
      x-cli: none
      x-cli-reason: 'Later: remaining console screens get commands in their own task (cli open question 7).'
      tags: [repositories]
      summary: The App's installations the user can see
      description: github-integration R5.17.
      x-auth: user
      x-rate-limit: 120/minute/user
      responses:
        '200':
          description: The installations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallationList'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/github/install-url:
    get:
      operationId: getAppInstallUrl
      x-cli: none
      x-cli-reason: 'Later: remaining console screens get commands in their own task (cli open question 7).'
      tags: [repositories]
      summary: GitHub's page to install the App on more repositories
      description: web-console 4.3.
      x-auth: admin
      x-rate-limit: 120/minute/user
      responses:
        '200':
          description: The URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppInstallUrl'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/github/repositories:
    get:
      operationId: listRepositories
      tags: [repositories]
      summary: Repositories of the installations, with pool state and policy
      description: >-
        github-integration R5.18. Each row says whether the user has GitHub
        admin rights on it (R5.19), its pool state and its variable status.
      x-auth: user
      x-rate-limit: 120/minute/user
      parameters:
        - name: installation_id
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: pool
          in: query
          required: false
          schema:
            type: string
            enum: [on, off]
        - name: q
          in: query
          required: false
          description: Search by name.
          schema:
            type: string
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of repositories.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryPage'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/repository-plans:
    post:
      operationId: planRepositoryChanges
      tags: [repositories]
      summary: Plan turning the pool on or off for repositories
      description: >-
        github-integration R5.20 and R5.29, web-console R5.18. Nothing changes.
        The plan names each variable to write or delete and the workflows that
        still use a variable that would go.
      x-auth: admin
      x-rate-limit: 60/minute/user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanRepositoryChangesRequest'
      responses:
        '201':
          description: The plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/repository-plans/{planId}:
    get:
      operationId: getRepositoryPlan
      tags: [repositories]
      summary: A repository plan with its outcome
      description: web-console R5.19 (done after reload shows the stored outcome).
      x-auth: user
      x-rate-limit: 600/minute/user
      parameters:
        - $ref: '#/components/parameters/PlanId'
      responses:
        '200':
          description: The plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/repository-plans/{planId}/apply:
    post:
      operationId: applyRepositoryChanges
      tags: [repositories]
      summary: Apply a repository plan after a yes
      description: >-
        github-integration R5.19, R5.20, R5.28 and R5.29. Needs admin or owner
        and GitHub admin on each repository. A stale plan is refused.
      x-auth: admin
      x-rate-limit: 30/minute/user
      parameters:
        - $ref: '#/components/parameters/PlanId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyPlanRequest'
      responses:
        '202':
          description: Applying; progress comes on the event stream and getRepositoryPlan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/repositories/{repositoryId}:
    get:
      operationId: getRepository
      x-cli: none
      x-cli-reason: 'Later: remaining console screens get commands in their own task (cli open question 7).'
      tags: [repositories]
      summary: One repository with its policy and variable status
      description: github-integration R5.18, R5.25 and R5.28.
      x-auth: user
      x-rate-limit: 600/minute/user
      parameters:
        - $ref: '#/components/parameters/RepositoryId'
      responses:
        '200':
          description: The repository.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Repository'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/repositories/{repositoryId}/policy:
    patch:
      operationId: updateRepositoryPolicy
      tags: [repositories]
      summary: Change a repository's policy
      description: >-
        github-integration R5.25 to R5.27, scheduling R5.4, R5.8 to R5.10.
        Turning fork jobs on needs `confirm_fork_risk`.
      x-auth: admin
      x-rate-limit: 60/minute/user
      parameters:
        - $ref: '#/components/parameters/RepositoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepositoryPolicyUpdate'
      responses:
        '200':
          description: The new policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryPolicy'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/repositories/{repositoryId}/extra-packages:
    get:
      operationId: getRepositoryExtraPackages
      tags: [repositories]
      summary: The extra distribution packages of a repository's pool
      description: >-
        runners R5.51. One package name per line in `text`; `packages` is the
        same list sorted without repeats. A changed list changes the image
        key, so the new image builds aside.
      x-auth: user
      x-rate-limit: 120/minute/user
      parameters:
        - $ref: '#/components/parameters/RepositoryId'
      responses:
        '200':
          description: The list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtraPackages'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: setRepositoryExtraPackages
      tags: [repositories]
      summary: Set the extra distribution packages of a repository's pool
      description: >-
        runners R5.51. The whole list is replaced. A name has only letters,
        digits and `+ - .` and does not start with `-`; a bad name refuses the
        list with its line number and nothing changes. An empty text clears
        the list.
      x-auth: admin
      x-rate-limit: 60/minute/user
      parameters:
        - $ref: '#/components/parameters/RepositoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtraPackagesUpdate'
      responses:
        '200':
          description: The saved list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtraPackages'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/repositories/{repositoryId}/runs-on:
    get:
      operationId: getRepositoryRunsOn
      x-cli: none
      x-cli-reason: 'Later: remaining console screens get commands in their own task (cli open question 7).'
      tags: [repositories]
      summary: Workflow `runs-on` findings for a repository
