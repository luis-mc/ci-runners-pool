      summary: Withdraw an unused join code
      x-auth: admin
      x-rate-limit: 30/minute/user
      parameters:
        - $ref: '#/components/parameters/JoinCodeId'
      responses:
        '204':
          description: Withdrawn.
        default:
          $ref: '#/components/responses/Error'
  /api/v1/install-command:
    get:
      operationId: getInstallCommand
      x-cli: none
      x-cli-reason: 'Later: remaining console screens get commands in their own task (cli open question 7).'
      tags: [machines]
      summary: The install command per OS, without a join code
