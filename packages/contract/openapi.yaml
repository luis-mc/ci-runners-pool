  /api/v1/settings/listen-address:
    get:
      operationId: getListenAddress
      x-cli: none
      x-cli-reason: 'A console setting: the owner chooses the controller address in the console (owner rule: everything from the web console).'
      tags: [settings]
      summary: The controller address, and the addresses of this PC to choose from
      description: >-
        operations R5.90. `running` is the address the controller listens on now;
        `stored` is the choice kept in the settings. CRSP_LISTEN_ADDR, when set,
        wins (`from_env`), and the console shows it read-only. `candidates` are
        found on this PC: its network address, the host address of Docker and
        WSL, and a typed address.
      x-auth: admin
      x-rate-limit: 60/minute/user
      responses:
        '200':
          description: The address and the choices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListenAddress'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: putListenAddress
      x-cli: none
      x-cli-reason: 'A console setting: the owner chooses the controller address in the console (owner rule: everything from the web console).'
      tags: [settings]
      summary: Choose the controller address
      description: >-
        operations R5.90. Checks the address (host:port, an address of this PC,
        not loopback), keeps it in the settings, writes one audit row, and
        restarts the controller once through the drain path: running jobs finish
        first. The controller then listens on the address over https with its
        own certificate, and on 127.0.0.1 too. Refused with 409 when
        CRSP_LISTEN_ADDR is set.
      x-auth: admin
      x-rate-limit: 10/minute/user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListenAddressChoice'
      responses:
        '202':
          description: Kept; the controller restarts when running jobs have finished.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListenAddressChosen'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/settings/signin-address:
    post:
      operationId: checkSignInAddress
      x-cli: none
      x-cli-reason: 'A console step: the owner adds a sign-in address to the GitHub App in the console (owner rule: everything from the web console).'
      tags: [settings]
      summary: Can GitHub sign in on this controller address?
      description: >-
        github-integration R5.8 (OPS16). Says whether the GitHub App has a
        callback URL for the address (`registered`), and gives the exact URL to
        add and the App's settings page. Does a dry sign-in against GitHub when
        the controller does not know the address yet, and keeps an address GitHub
        accepted. Never signs anyone in.
      x-auth: admin
      x-rate-limit: 20/minute/user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListenAddressChoice'
      responses:
        '200':
          description: The sign-in address and whether GitHub knows it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInAddress'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/settings/public-repositories:
    get:
      operationId: getPublicRepositories
      tags: [settings]
      summary: Whether crsp serves public repositories
      description: >-
        github-integration R5.54. Off by default: crsp offers private
        repositories only. `public_on_pool` counts the public repositories whose
        pool is on now, so the console can name the number before the setting is
        switched off.
      x-auth: user
      x-rate-limit: 600/minute/user
      responses:
        '200':
          description: The setting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicRepositories'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: setPublicRepositories
      tags: [settings]
      summary: Turn public repositories on or off
      description: >-
        github-integration R5.54 and R5.55. Switching off turns the pool off for
        every public repository that has it on (its settings stay), sets its
        RUNS_ON variables to the hosted labels, drains and removes its runners,
        and audits each. `stopped` is how many repositories that was. Switching
        on stops nothing and turns nothing on by itself.
      x-auth: owner
      x-rate-limit: 10/minute/user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicRepositoriesSet'
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicRepositoriesResult'
        default:
          $ref: '#/components/responses/Error'

