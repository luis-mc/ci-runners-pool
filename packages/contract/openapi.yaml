    put:
      operationId: updatePoolSettings
      x-cli: none
      x-cli-reason: 'Later: remaining console screens get commands in their own task (cli open question 7).'
      tags: [machines]
      summary: Change the defaults for new machines
      x-auth: admin
      x-rate-limit: 60/minute/user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PoolSettings'
      responses:
        '200':
