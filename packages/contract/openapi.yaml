    get:
      operationId: getRunner
      tags: [runners]
      summary: One runner
      x-auth: user
      x-rate-limit: 600/minute/user
      parameters:
        - $ref: '#/components/parameters/RunnerId'
      responses:
        '200':
          description: The runner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Runner'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteRunner
      tags: [runners]
      summary: Remove a runner after a drain, with a remove token
      description: >-
        runners R5.4. Without `confirm=true` it answers 409
        needs_confirmation naming what goes and the job it waits for.
      x-auth: admin
      x-rate-limit: 30/minute/user
      parameters:
        - $ref: '#/components/parameters/RunnerId'
        - $ref: '#/components/parameters/Confirm'
      responses:
        '202':
          description: Removing; waits for the drain.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Runner'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/runners/{runnerId}/registration:
    delete:
      operationId: deleteRunnerRegistration
      tags: [runners]
      summary: Delete the registration of an offline runner whose agent cannot remove it
      description: >-
        github-integration R5.33. For a runner GitHub lists as offline and not
        busy, when its machine cannot run the remove step. Without
        `confirm=true` it answers 409 needs_confirmation naming the runner.
        With it the controller deletes the registration at GitHub, then cleans
        the machine if it answers, and drops the record. An online or busy
        runner is refused with 409.
      x-auth: admin
      x-rate-limit: 30/minute/user
      parameters:
        - $ref: '#/components/parameters/RunnerId'
        - $ref: '#/components/parameters/Confirm'
      responses:
