      operationId: createNotificationChannel
      x-cli: none
      x-cli-reason: 'Later: remaining console screens get commands in their own task (cli open question 7).'
      tags: [notifications]
      summary: Add a notification channel
      description: >-
        notifications R5.7 to R5.9 and R5.19. Any signed-in user adds a personal
        channel (email, desktop); a webhook needs admin or owner and an HTTPS
        URL, else 403 forbidden. Secrets in the request are write-only.
      x-auth: user
      x-rate-limit: 30/minute/user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationChannelInput'
      responses:
        '201':
          description: The channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationChannel'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/notification-channels/{channelId}:
    patch:
      operationId: updateNotificationChannel
      x-cli: none
      x-cli-reason: 'Later: remaining console screens get commands in their own task (cli open question 7).'
      tags: [notifications]
      summary: Change a notification channel
      description: >-
        notifications R5.7 to R5.9. The kind never changes. A field left out
        keeps its value; a secret left out stays, a secret sent as an empty
        string is removed.
      x-auth: user
      x-rate-limit: 60/minute/user
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationChannelUpdate'
      responses:
        '200':
          description: The channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationChannel'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteNotificationChannel
      x-cli: none
      x-cli-reason: 'Later: remaining console screens get commands in their own task (cli open question 7).'
      tags: [notifications]
      summary: Remove a notification channel
      description: >-
        Without `confirm=true` it answers 409 needs_confirmation naming the
        channel and the events it carries (UX-62).
      x-auth: user
      x-rate-limit: 30/minute/user
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/Confirm'
      responses:
        '204':
          description: Removed.
        default:
          $ref: '#/components/responses/Error'
  /api/v1/notification-channels/{channelId}/test:
    post:
      operationId: testNotificationChannel
      x-cli: none
      x-cli-reason: 'Later: remaining console screens get commands in their own task (cli open question 7).'
      tags: [notifications]
      summary: Send a test notice through a channel
      description: >-
        notifications R5.9. Sends one clearly marked test notice and answers
        what happened. A failed delivery is a 200 with `ok: false` and the
        reason, not an error.
      x-auth: user
      x-rate-limit: 5/minute/user
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '200':
          description: The result of the test.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationTestResult'
        default:
          $ref: '#/components/responses/Error'

  # ---------------------------------------------------------------- updates (CRSP32)
  /webhooks/github:
    post:
      operationId: receiveGithubWebhook
      x-cli: none
      x-cli-reason: 'Browser or GitHub entry point; the CLI signs in with the device flow instead.'
      tags: [webhooks]
      summary: GitHub webhook deliveries
      description: >-
        github-integration R5.36 and R6.5. Authorised by the
        `X-Hub-Signature-256` signature (constant-time compare), not a session;
        a bad signature gets 401 before the body is parsed. Bodies over 25 MB
        are refused. Deliveries are de-duplicated by `X-GitHub-Delivery`.
      x-auth: public
      x-rate-limit: 600/minute/ip
      parameters:
        - name: X-GitHub-Event
          in: header
          required: true
          schema:
            type: string
        - name: X-GitHub-Delivery
          in: header
          required: true
          schema:
            type: string
        - name: X-Hub-Signature-256
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '202':
          description: Taken.
        default:
          $ref: '#/components/responses/Error'

components:
  parameters:
    OAuthCode:
      name: code
      in: query
      required: true
      schema:
        type: string
    OAuthState:
      name: state
      in: query
      required: true
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from the previous page's `next_cursor`.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    From:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date-time
    Confirm:
      name: confirm
      in: query
      required: false
      description: The yes to a question card that named what goes (UX-62).
      schema:
        type: boolean
        default: false
    Confirmed:
      name: confirmed
      in: query
      required: false
      description: The yes to the Review step that named the running jobs (tray R5.16).
      schema:
        type: boolean
        default: false
    UserId:
      name: userId
      in: path
      required: true
      description: The numeric GitHub user id.
      schema:
        type: integer
        format: int64
    TokenId:
      name: tokenId
      in: path
      required: true
      schema:
        type: string
    RepositoryId:
      name: repositoryId
      in: path
      required: true
      description: The numeric GitHub repository id.
      schema:
        type: integer
        format: int64
    PlanId:
      name: planId
      in: path
      required: true
      schema:
        type: string
    MachineId:
      name: machineId
      in: path
      required: true
      schema:
        type: string
    ChangeId:
      name: changeId
      in: path
      required: true
      schema:
        type: string
    JoinCodeId:
      name: joinCodeId
      in: path
      required: true
      schema:
        type: string
    SetName:
      name: setName
      in: path
      required: true
      schema:
        type: string
    RunnerId:
      name: runnerId
      in: path
      required: true
      schema:
        type: string
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
    BackupId:
      name: backupId
      in: path
      required: true
      schema:
        type: string
    ImageId:
      name: imageId
      in: path
      required: true
      schema:
        type: string
    CacheId:
      name: cacheId
      in: path
      required: true
      schema:
        type: string
    ChannelId:
      name: channelId
      in: path
      required: true
      schema:
        type: string

  responses:
    Error:
      description: Any error, in the error envelope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ExportFile:
      description: >-
        The export as a file. `Content-Disposition` carries the file name, named
        for what the file holds then the stamp (UX-39).
      headers:
        Content-Disposition:
          required: true
          schema:
            type: string
          example: attachment; filename="crsp-jobs-2026-11-14-1005.csv"
      content:
        text/csv:
          schema:
            type: string
        application/json:
          schema:
            type: string
        application/yaml:
          schema:
            type: string
    Redirect:
      description: A redirect. May set or clear a cookie.
      headers:
        Location:
          required: true
          schema:
            type: string
        Set-Cookie:
          schema:
            type: string

  schemas:
    SpeedStat:
      type: object
      required: [count, median_seconds, p95_seconds]
      properties:
        count: { type: integer }
        median_seconds: { type: number }
        p95_seconds: { type: number }
    SpeedSide:
      type: object
      required: [queue, run]
      properties:
        queue: { $ref: '#/components/schemas/SpeedStat' }
        run: { $ref: '#/components/schemas/SpeedStat' }
    SpeedRow:
      type: object
      required: [job, crsp, hosted, minutes_saved, cost_avoided_usd]
      properties:
        job: { type: string }
        crsp: { $ref: '#/components/schemas/SpeedSide' }
        hosted: { $ref: '#/components/schemas/SpeedSide' }
        minutes_saved: { type: number }
        cost_avoided_usd: { type: number }
    SpeedComparison:
      type: object
      required:
        [
          repository,
          days,
          since,
          excluded,
          rows,
          unmatched_jobs,
          total_minutes_saved,
          total_cost_avoided_usd,
        ]
      properties:
        repository: { type: string }
        days: { type: integer }
        since: { type: string, format: date-time }
        excluded: { type: boolean }
        reason: { type: string }
        rows:
          type: array
          items: { $ref: '#/components/schemas/SpeedRow' }
        unmatched_jobs: { type: integer }
        total_minutes_saved: { type: number }
        total_cost_avoided_usd: { type: number }
    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
      example:
        status: ok
        version: v0.1.0
    EnvVar:
      type: object
      required: [name, sensitive]
      properties:
        name: { type: string }
        value:
          type: string
          description: Absent for a sensitive variable.
        sensitive: { type: boolean }
    EnvSet:
      type: object
      required: [name, vars]
      properties:
        name: { type: string }
        vars:
          type: array
          items: { $ref: '#/components/schemas/EnvVar' }
    EnvSetList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/EnvSet' }
    EnvVarInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        value: { type: string }
        sensitive: { type: boolean }
    EnvSetInput:
      type: object
      required: [vars]
      properties:
        vars:
          type: array
          items: { $ref: '#/components/schemas/EnvVarInput' }
    ResolvedEnvVar:
      type: object
      required: [name, value, sensitive, source]
      properties:
        name: { type: string }
        value:
          type: string
          description: '"***" for a sensitive variable.'
        sensitive: { type: boolean }
        source:
          type: string
          description: '"machine", "set:<name>" or "runner".'
    RunnerEnv:
      type: object
      required: [runner_id, vars]
      properties:
        runner_id: { type: string }
        vars:
          type: array
          items: { $ref: '#/components/schemas/ResolvedEnvVar' }
    RegistryLogin:
      type: object
      required: [kind, host, username]
      properties:
        kind:
          type: string
          enum: [container, vm, persistent]
        host: { type: string }
        username: { type: string }
    RegistryLoginInput:
      type: object
      required: [kind, host, username]
      properties:
        kind:
          type: string
          enum: [container, vm, persistent]
        host: { type: string }
        username: { type: string }
        password:
          type: string
          description: Write only. Empty keeps the stored one.
    CaBundleInput:
      type: object
      required: [pem]
      properties:
        pem: { type: string }
    RegistrySettings:
      type: object
      required: [logins, ca_bundle_set]
      properties:
        logins:
          type: array
          items: { $ref: '#/components/schemas/RegistryLogin' }
        ca_bundle_set: { type: boolean }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      example:
        error:
          code: needs_confirmation
          message: Removing runner crsp-linux-1 waits for 1 running job.
          details:
            - kind: job
              id: '81234567'
              text: owner/app ci.yml test (started 14:05)
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable code.
        message:
          type: string
          description: Human-readable text. Never contains secrets.
        details:
          type: array
          description: >-
            For needs_confirmation, each item that goes or job it waits for;
            for bad_request, each field problem.
          items:
            $ref: '#/components/schemas/ErrorDetail'
    ErrorDetail:
      type: object
      required: [kind, text]
      properties:
        kind:
          type: string
          example: field
        id:
          type: string
        text:
          type: string

    # ---------- shared enums
    Role:
      type: string
      enum: [owner, admin, viewer]
    OS:
      type: string
      enum: [linux, windows, macos]
    Arch:
      type: string
      enum: [x64, arm64]
    Theme:
      type: string
      enum: [system, dark, light]
    RunnerKind:
      type: string
      enum: [persistent, ephemeral]
    Isolation:
      type: string
      enum: [microVM, VM, container, persistent]
    RunnerState:
      type: string
      description: >-
        What the runner really is (web-console UX-19). idle only when GitHub reports it online and
        not busy and its service runs; not_registered, stopped and unknown say why it is not.
      enum:
        [
          creating,
          idle,
          busy,
          draining,
          updating,
          offline,
          failed,
          removing,
          not_registered,
          stopped,
          unknown,
        ]
    MachineState:
      type: string
      description: active and drained are set by the user; draining while a drain waits.
      enum: [active, draining, drained, removing]
    BackendName:
      type: string
      enum: [persistent, docker, podman, nerdctl, wsl2, hyperv, kvm, tart, firecracker]
    JobResult:
      type: string
      enum: [success, failure, cancelled, timed_out, lost]
    WaitReason:
      type: string
      description: observability R5.5.
      enum:
        [
          free_slot,
          load_over_budget,
          no_runner_with_labels,
          repository_parallel_limit,
          machine_drained,
          quiet_hours,
          load_not_measured,
          paused,
          on_battery,
          unknown,
        ]
    Severity:
      type: string
      enum: [ok, info, skip, warn, fail]
    VariableStatus:
      type: string
      enum: [ok, missing, wrong, not_managed]

    # ---------- setup and auth
    SetupState:
      type: object
      required: [has_app, has_owner, setup_link_redeemed, steps]
      properties:
        has_app:
          type: boolean
        has_owner:
          type: boolean
        setup_link_redeemed:
          type: boolean
          description: True when this browser holds a valid setup cookie.
        app:
          $ref: '#/components/schemas/GitHubApp'
        steps:
          type: object
          required: [connect_github, first_machine, first_repository]
          properties:
            connect_github:
              type: string
              enum: [todo, done]
            first_machine:
              type: string
              enum: [todo, done]
            first_repository:
              type: string
              enum: [todo, done]
      example:
        has_app: false
        has_owner: false
        setup_link_redeemed: true
        steps:
          connect_github: todo
          first_machine: todo
          first_repository: todo
    RedeemSetupLinkRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
    StartAppManifestRequest:
      type: object
      required: [account_type, app_name, console_urls]
      properties:
        account_type:
          type: string
          enum: [user, organization]
        organization:
          type: string
          description: The organization login when account_type is organization.
        app_name:
          type: string
          example: crsp-home
        console_urls:
          type: array
          description: Console addresses; each gets `/auth/github/callback` (R5.4).
          items:
            type: string
          example: ['http://127.0.0.1:8460', 'https://pool.lan:8460']
    AppManifestForm:
      type: object
      required: [post_url, manifest, state]
      properties:
        post_url:
          type: string
          example: https://github.com/settings/apps/new?state=abc
        manifest:
          type: object
          additionalProperties: true
        state:
          type: string
    GitHubApp:
      type: object
      required: [id, slug, owner_login, html_url, webhook_active]
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
        owner_login:
          type: string
        html_url:
          type: string
        webhook_active:
          type: boolean
        permissions:
          type: object
          additionalProperties:
            type: string
      example:
        id: 1234567
        slug: crsp-home
        owner_login: luis-mc
        html_url: https://github.com/apps/crsp-home
        webhook_active: false
    CliLoginConfig:
      type: object
      required: [client_id, device_code_url, verification_url]
      properties:
        client_id:
          type: string
          example: Iv23liExample
        device_code_url:
          type: string
          example: https://github.com/login/device/code
        verification_url:
          type: string
          example: https://github.com/login/device
    ExchangeCliTokenRequest:
      type: object
      required: [github_credential, name]
      properties:
        github_credential:
          type: string
          description: The device-flow user token. Checked once and dropped.
        name:
          type: string
          description: A label for the token list, such as the host name.
          example: laptop
    AccessCredential:
      type: object
      required: [id, name, scope, created_by, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        scope:
          $ref: '#/components/schemas/AccessScope'
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
    AccessScope:
      type: string
      enum: [parity]
      description: '`parity` is read only: the runner list and a doctor run.'
    AccessCredentialList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccessCredential'
    AccessCredentialCreate:
      type: object
      required: [name, scope]
      properties:
        name:
          type: string
          maxLength: 80
        scope:
          $ref: '#/components/schemas/AccessScope'
    AccessCredentialCreated:
      type: object
      required: [value, info]
      properties:
        value:
          type: string
          description: The credential. Shown once.
        info:
          $ref: '#/components/schemas/AccessCredential'
    GithubGrant:
      type: object
      required: [ready, steps, missing]
      description: github-integration R5.86.
      properties:
        ready:
          type: boolean
          description: Every needed permission is accepted by the installation.
        next:
          type: string
          enum: [install, ask, accept]
          description: The first step that is not done. Absent when ready.
        missing:
          type: array
          description: The needed permissions that are not accepted yet, by GitHub's name.
          items:
            type: string
        installation_id:
          type: integer
          format: int64
        steps:
          type: array
          items:
            $ref: '#/components/schemas/GithubGrantStep'
    GithubGrantStep:
      type: object
      required: [id, done, permissions]
      properties:
        id:
          type: string
          enum: [install, ask, accept]
        done:
          type: boolean
        permissions:
          type: array
          description: The permissions still waiting at this step.
          items:
            type: string
        url:
          type: string
          description: The GitHub page of the step. Absent when the step has none.
    ParitySetupRequest:
      type: object
      description: No fields. The address is the controller's own, never one the browser sends (CRSP141).
    ListenAddressCandidate:
      type: object
      required: [id, label, who]
      properties:
        id:
          type: string
          enum: [pc, docker, other]
        label:
          type: string
        address:
          type: string
          description: host:port. Empty for the typed choice.
        who:
          type: string
          description: One line on who can reach it.
        recommended:
          type: boolean
    ListenAddress:
      type: object
      required: [running, from_env, candidates]
      properties:
        running:
          type: string
          description: The address the controller listens on now (host:port).
        stored:
          type: string
          description: The address chosen in the console, when there is one.
        from_env:
          type: boolean
          description: CRSP_LISTEN_ADDR is set and wins; the console cannot change it.
        env_name:
          type: string
        problem:
          type: string
          description: Why the controller did not listen on the stored address at start.
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/ListenAddressCandidate'
    ListenAddressChoice:
      type: object
      required: [address]
      properties:
        address:
          type: string
          description: host:port of this PC.
    SignInAddress:
      type: object
      required: [address, callback_url, registered]
      properties:
        address:
          type: string
          description: The console origin, such as https://192.168.1.162:8460.
        callback_url:
          type: string
          description: The exact callback URL to add to the GitHub App.
        app_url:
          type: string
          description: The App's settings page on GitHub, when the App is known.
        registered:
          type: boolean
          description: GitHub accepts the callback URL, so sign-in works on this address.
    ListenAddressChosen:
      type: object
      required: [address, restarting]
      properties:
        address:
          type: string
        restarting:
          type: boolean
    ParityAddress:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unreachable, needs_address]
        url:
          type: string
          description: The address that will be written as CRSP_URL. Empty with needs_address.
        problem:
          type: string
          description: Why the address does not answer, or why the controller has none.
        setting:
          type: string
          description: The setting to fix when the controller has no address a runner can reach.
    ParitySetup:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [done, needs_permission, needs_address]
        missing_permissions:
          type: array
          items:
            type: string
        grant:
          $ref: '#/components/schemas/GithubGrant'
        access_name:
          type: string
          description: The name of the repository Actions value that holds the access, CRSP_ACCESS.
        variable_names:
          type: array
          items:
            type: string
        access_id:
          type: string
          description: The id of the access credential that was made.
        address_problem:
          type: string
          description: With needs_address, why the controller has no address a runner can reach.
        address_setting:
          type: string
          description: With needs_address, the setting to fix.
    CliToken:
      type: object
      required: [id, name, user_id, user_login, created_at, expires_at]
      properties:
        id:
          type: string
        name:
          type: string
        user_id:
          type: integer
          format: int64
        user_login:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
    CliTokenCreated:
      type: object
      required: [token, info]
      properties:
        token:
          type: string
          description: Shown once; the controller keeps only its hash.
        info:
          $ref: '#/components/schemas/CliToken'
    CliTokenList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CliToken'
    ConsoleLink:
      type: object
      required: [url, expires_at]
      properties:
        url:
          type: string
          description: The one-time console link. Shown once.
        expires_at:
          type: string
          format: date-time
    Session:
      type: object
      required: [user, csrf, github_signin]
      properties:
        user:
          $ref: '#/components/schemas/User'
        csrf:
          type: string
          description: Send as X-CSRF-Token on every change.
        github_signin:
          $ref: '#/components/schemas/GitHubSignIn'
      example:
        user:
          id: 583231
          login: luis-mc
          role: owner
          added_at: '2026-11-14T10:00:00Z'
        csrf: 5d1c0e
        github_signin:
          state: active
          expires_at: '2026-11-17T18:30:00Z'
    GitHubSignIn:
      type: object
      description: >-
        The user's GitHub sign-in. The GitHub token is held in memory only and
        lasts 8 hours; a controller restart or the 8 hours end it. The web session
        itself carries on (github-integration R6.2).
      required: [state]
      properties:
        state:
          type: string
          enum: [active, ended]
        expires_at:
          type: string
          format: date-time
          description: When the sign-in ends. Present when state is active and GitHub gave a limit.
    Preferences:
      type: object
      required: [theme]
      properties:
        theme:
          $ref: '#/components/schemas/Theme'
      example:
        theme: dark

    # ---------- users
    User:
      type: object
      required: [id, login, role, added_at]
      properties:
        id:
          type: integer
          format: int64
          description: The numeric GitHub user id (R5.9).
        login:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        added_by:
          type: string
        added_at:
          type: string
          format: date-time
        last_sign_in_at:
          type: string
          format: date-time
      example:
        id: 583231
        login: luis-mc
        role: owner
        added_at: '2026-11-14T10:00:00Z'
    UserList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
    AddUserRequest:
      type: object
      required: [login, role]
      properties:
        login:
          type: string
          example: octocat
        role:
          type: string
          enum: [admin, viewer]
    UpdateUserRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/Role'
        confirm:
          type: boolean
          description: Needed to hand over the owner role.

    # ---------- repositories
    Installation:
      type: object
      required: [id, account_login, account_type, suspended, repository_selection]
      properties:
        id:
          type: integer
          format: int64
        account_login:
          type: string
        account_type:
          type: string
          enum: [User, Organization]
        suspended:
          type: boolean
        repository_selection:
          type: string
          enum: [all, selected]
        missing_permissions:
          type: array
          description: github-integration R5.24.
          items:
            type: string
      example:
        id: 4455667
        account_login: luis-mc
        account_type: User
        suspended: false
        repository_selection: selected
    OrgPool:
      type: object
      required:
        [
          installation_id,
          organization,
          is_organization,
          eligible,
          enabled,
          group_name,
          repositories,
        ]
      properties:
        installation_id:
          type: integer
          format: int64
        organization:
          type: string
          description: The account login of the installation.
        is_organization:
          type: boolean
          description: False for a personal account, which keeps repository runners.
        eligible:
          type: boolean
          description: True when the pool per organization can be turned on.
        reason:
          type: string
          description: Why it cannot be turned on, when eligible is false.
        enabled:
          type: boolean
        group_name:
          type: string
          description: The runner group, named for the pool.
        group_id:
          type: integer
          format: int64
        repositories:
          type: array
          description: Full names of the repositories the runner group is visible to.
          items:
            type: string
        changed_at:
          type: string
          format: date-time
        changed_by:
          type: string
      example:
        installation_id: 4455667
        organization: acme
        is_organization: true
        eligible: true
        enabled: true
        group_name: crsp-home
        group_id: 7
        repositories: [acme/api, acme/web]
    OrgPoolList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrgPool'
      example:
        items: []
    OrgPoolSet:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
      example:
        enabled: true
    InstallationList:
      type: object
      required: [items, stale]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Installation'
        stale:
          $ref: '#/components/schemas/Staleness'
    Staleness:
      type: object
      description: Set when GitHub did not answer and the last copy is shown (UX-53).
      required: [stale]
      properties:
        stale:
          type: boolean
        as_of:
          type: string
          format: date-time
        reason:
          type: string
          enum: [session_expired, permission_missing, unreachable, github_error]
          description: Why the list is the last copy (CRSP148, UX-28).
        status:
          type: integer
          description: The HTTP status GitHub answered with, when it answered.
        message:
          type: string
          description: What GitHub said, word for word, when it answered.
    AppHealth:
      type: object
      required: [gone]
      properties:
        gone:
          type: boolean
          description: True when GitHub says the App or its key is gone (R5.6).
        reason:
          type: string
          description: Why, in words for the page. Only when gone.
        checked_at:
          type: string
          format: date-time
          description: When GitHub last answered. Absent before the first answer.
    AppInstallUrl:
      type: object
      required: [url]
      properties:
        url:
          type: string
          example: https://github.com/apps/crsp-home/installations/new
    TrialSet:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [off, observe, shadow, canary]
        percent:
          type: integer
          minimum: 0
          maximum: 100
          description: Canary only. The share of jobs, chosen by job name.
        jobs:
          type: array
          items: { type: string }
          description: Canary only. Jobs that always use crsp.
        shadow_workflow:
          type: string
          description: Shadow only. The workflow file to dispatch.
        shadow_jobs:
          type: array
          items: { type: string }
          description: Shadow only. Jobs to copy; empty means every job crsp would take.
    TrialSide:
      type: object
      required: [runs, succeeded, avg_wait_sec, avg_run_sec]
      properties:
        runs: { type: integer }
        succeeded: { type: integer }
        avg_wait_sec: { type: integer }
        avg_run_sec: { type: integer }
    TrialJob:
      type: object
      required: [job, hosted, crsp, would_take]
      properties:
        job: { type: string }
        hosted: { $ref: '#/components/schemas/TrialSide' }
        crsp: { $ref: '#/components/schemas/TrialSide' }
        would_take: { type: integer }
        agree:
          type: boolean
          description: Present when the job ran on both sides.
    Trial:
      type: object
      required: [repository, mode, variables, total, hosted, crsp, jobs]
      properties:
        repository: { type: string }
        mode:
          type: string
          enum: [off, observe, shadow, canary]
        since: { type: string, format: date-time }
        percent: { type: integer }
        canary_jobs:
          type: array
          items: { type: string }
        shadow_workflow: { type: string }
        shadow_jobs:
          type: array
          items: { type: string }
        variables:
          type: array
          items: { type: string }
          description: The canary variables now written.
        total: { type: integer }
        hosted: { $ref: '#/components/schemas/TrialSide' }
        crsp: { $ref: '#/components/schemas/TrialSide' }
        jobs:
          type: array
          items: { $ref: '#/components/schemas/TrialJob' }
    Repository:
      type: object
      required:
        [
          id,
          full_name,
          owner,
          name,
          installation_id,
          visibility,
          pool_on,
          user_is_github_admin,
          user_admin_known,
          variables,
          policy,
        ]
      properties:
        id:
          type: integer
          format: int64
        full_name:
          type: string
        owner:
          type: string
        name:
          type: string
        installation_id:
          type: integer
          format: int64
        visibility:
          type: string
          enum: [public, private, internal]
        default_branch:
          type: string
        pool_on:
          type: boolean
        pool_off_reason:
          type: string
          enum: [left_installation]
          description: >-
            Why the pool is off when the controller turned it off
            (github-integration R5.22). Absent otherwise.
        user_is_github_admin:
          type: boolean
          description: github-integration R5.19; without it the switch is disabled with this reason. Only a claim when user_admin_known is true.
        user_admin_known:
          type: boolean
          description: >-
            False when the controller could not read the user's admin rights (no
            GitHub sign-in in memory and the App could not say). Then
            user_is_github_admin means "not checked", not "not admin"
            (github-integration R5.19).
        variables:
          type: array
          items:
            $ref: '#/components/schemas/RepositoryVariable'
        policy:
          $ref: '#/components/schemas/RepositoryPolicy'
        routing:
          $ref: '#/components/schemas/RepositoryRouting'
        webhook:
          $ref: '#/components/schemas/WebhookHealth'
        problem:
          $ref: '#/components/schemas/RepositoryProblem'
      example:
        id: 700100
        full_name: luis-mc/app
        owner: luis-mc
        name: app
        installation_id: 4455667
        visibility: private
        default_branch: main
        pool_on: true
        user_is_github_admin: true
        user_admin_known: true
        variables:
          - name: RUNS_ON_LINUX
            status: ok
            value: '["self-hosted","linux","x64"]'
        policy:
          priority: 0
          max_parallel_jobs: 2
          allow_fork_pull_requests: false
          labels: [self-hosted, linux, x64]
          runner_groups: []
          light_runner: true
    PublicRepositories:
      type: object
      required: [enabled, public_on_pool]
      properties:
        enabled:
          type: boolean
          description: False by default.
        changed_at:
          type: string
          format: date-time
          description: Absent when the setting was never changed.
        changed_by:
          type: string
          description: Login of who changed it last. Absent when never changed.
        public_on_pool:
          type: integer
          description: Public repositories whose pool is on now.
      example:
        enabled: false
        public_on_pool: 0
    PublicRepositoriesSet:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
    PublicRepositoriesResult:
      allOf:
        - $ref: '#/components/schemas/PublicRepositories'
        - type: object
          required: [stopped]
          properties:
            stopped:
              type: integer
              description: Repositories whose pool this change switched off (0 when switching on).
    RepositoryProblem:
      type: object
      description: >-
        A fault the owner can fix on a repository (github-integration R5.56).
        Absent when there is none.
      required: [code, text, actions]
      properties:
        code:
          type: string
          enum: [public_pool_on_while_off]
        text:
          type: string
        actions:
          type: array
          items:
            $ref: '#/components/schemas/RepositoryProblemAction'
    RepositoryProblemAction:
      type: object
      required: [id, label]
      properties:
        id:
          type: string
          enum: [turn_on_public_repositories, turn_off_pool]
        label:
          type: string
    WebhookHealth:
      type: object
      description: The last webhook delivery of a repository and how the controller learns about its jobs (github-integration R5.50).
      required: [mode, failures_in_a_row]
      properties:
        mode:
          type: string
          enum: [webhook, polling]
        last_delivery_at:
          type: string
          format: date-time
          description: Absent when no delivery was seen.
        last_result:
          type: string
          enum: [ok, failed, missed]
        failures_in_a_row:
          type: integer
        polling_since:
          type: string
          format: date-time
          description: Set in polling mode.
    AppKeyUpload:
      type: object
      description: A new App private key, sent once and never returned (github-integration R5.7).
      required: [pem]
      additionalProperties: false
      properties:
        pem:
          type: string
          minLength: 1
          maxLength: 16384
          description: The file GitHub gives, in PEM form.
    WebhookModeUpdate:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [webhook]
    RepositoryRouting:
      type: object
      description: Where the jobs of a repository go now and why (github-integration R5.44). Absent while the pool is off for the repository.
      required: [where, why, used_minutes]
      properties:
        where:
          type: string
          enum: [crsp, hosted, waiting]
        why:
          type: string
          description: A code the console turns into words. machine_up, fallback_on, fallback_off, grace, cap_reached or public_repository.
          enum:
            [machine_up, fallback_on, fallback_off, grace, cap_reached, public_repository]
        oses:
          type: array
          description: The operating systems the reason is about.
          items:
            type: string
            enum: [linux, windows, macos]
        used_minutes:
          type: integer
          description: Fallback minutes counted this month (UTC), best effort.
      example:
        where: hosted
        why: fallback_on
        oses: [linux]
        used_minutes: 12
    RepositoryVariable:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
          enum: [RUNS_ON_LINUX, RUNS_ON_WINDOWS, RUNS_ON_MACOS, RUNS_ON_LIGHT]
        status:
          $ref: '#/components/schemas/VariableStatus'
        value:
          type: string
          description: The JSON list of labels as written.
        written_at:
          type: string
          format: date-time
    RepositoryPolicy:
      type: object
      required:
        [
          priority,
          max_parallel_jobs,
          allow_fork_pull_requests,
          labels,
          runner_groups,
          light_runner,
        ]
      properties:
        priority:
          type: integer
          description: Higher goes first (scheduling R5.8).
          minimum: -100
          maximum: 100
        max_parallel_jobs:
          type: integer
          minimum: 1
          maximum: 256
        allow_fork_pull_requests:
          type: boolean
        labels:
          type: array
          description: Generic labels only (github-integration R5.27).
          items:
            type: string
        runner_groups:
          type: array
          items:
            type: string
        light_runner:
          type: boolean
          description: Keep one light runner per OS for this repository and write RUNS_ON_LIGHT, so jobs that last seconds do not queue behind a long build (scheduling R5.65). On by default.
        legacy_vars:
          type: boolean
          description: Also write CI_RUNS_ON and CI_RUNS_ON_WINDOWS with the same labels as RUNS_ON_LINUX and RUNS_ON_WINDOWS, for workflows that still follow the old dev-standards templates (github-integration R5.39). Off by default; for the move from the old pool.
        budget_memory_pct:
          type: integer
          description: May lower the machine budget for this repository's jobs, never raise it (scheduling R5.4).
          minimum: 1
          maximum: 100
        budget_cpu_pct:
          type: integer
          minimum: 1
          maximum: 100
        extra_packages:
          type: array
          description: Extra distribution packages of the pool image (runners R5.51).
          items:
            type: string
        hosted_fallback:
          type: boolean
          description: Run on GitHub-hosted runners while no crsp machine can take the jobs (github-integration R5.42). Off by default; GitHub may bill those minutes for a private repository.
        fallback_cap_minutes:
          type: integer
          description: Monthly cap of fallback minutes; absent means no cap.
          minimum: 1
        hosted_labels:
          type: object
          description: The hosted label per operating system; a missing one is the default (ubuntu-latest, windows-latest, macos-latest).
          additionalProperties:
            type: string
        updated_at:
          type: string
          format: date-time
        updated_by:
          type: string
    RepositoryPolicyUpdate:
      type: object
      properties:
        priority:
          type: integer
          minimum: -100
          maximum: 100
        max_parallel_jobs:
          type: integer
          minimum: 1
          maximum: 256
        allow_fork_pull_requests:
          type: boolean
        light_runner:
          type: boolean
          description: Turn the light runner on or off (scheduling R5.65).
        legacy_vars:
          type: boolean
          description: Turn the old variable names CI_RUNS_ON and CI_RUNS_ON_WINDOWS on or off (github-integration R5.39).
        confirm_fork_risk:
          type: boolean
          description: Needed to turn fork jobs on (github-integration R5.26).
        hosted_fallback:
          type: boolean
          description: Turn the hosted fallback on or off (github-integration R5.42). A public repository is refused.
        confirm_fallback_cost:
          type: boolean
          description: The yes to the question that says GitHub may bill the fallback minutes. Needed to turn the fallback on.
        fallback_cap_minutes:
          type: integer
          minimum: 0
          description: Monthly cap of fallback minutes; 0 clears it.
        hosted_labels:
          type: object
          description: Hosted label per operating system (linux, windows, macos); an empty value puts the default back.
          additionalProperties:
            type: string
        labels:
          type: array
          items:
            type: string
        runner_groups:
          type: array
          items:
            type: string
        budget_memory_pct:
          type: integer
          minimum: 1
          maximum: 100
        budget_cpu_pct:
          type: integer
          minimum: 1
          maximum: 100
      example:
        priority: 10
        max_parallel_jobs: 3
    ExtraPackages:
      type: object
      required: [packages, text]
      properties:
        packages:
          type: array
          description: The names, sorted, without repeats.
          items:
            type: string
        text:
          type: string
          description: The names, one per line.
      example:
        packages: [libc++-dev, zlib1g-dev]
        text: "libc++-dev\nzlib1g-dev"
    ExtraPackagesUpdate:
      type: object
      required: [text]
      properties:
        text:
          type: string
          description: The whole list, one name per line. Blank lines and lines that start with # are skipped.
          maxLength: 20000
      example:
        text: "zlib1g-dev\nlibc++-dev"
    RepositoryPage:
      type: object
      required: [items, stale]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Repository'
        next_cursor:
          type: string
        stale:
          $ref: '#/components/schemas/Staleness'
    PlanRepositoryChangesRequest:
      type: object
      required: [changes]
      properties:
        changes:
          type: array
          minItems: 1
          items:
            type: object
            required: [repository_id, pool]
            properties:
              repository_id:
                type: integer
                format: int64
              pool:
                type: string
                enum: [on, off]
      example:
        changes:
          - repository_id: 700100
            pool: on
    RunsOnFinding:
      type: object
      required: [path, line, labels, kind, text]
      properties:
        path:
          type: string
          example: .github/workflows/ci.yml
        line:
          type: integer
        labels:
          type: array
          items:
            type: string
        kind:
          type: string
          enum: [no_runner_with_labels, not_generic, uses_variable, hosted]
        text:
          type: string
    RunsOnFindingList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RunsOnFinding'
        checked_at:
          type: string
          format: date-time
    QueueSettings:
      type: object
      required: [order, fair_share, no_runner_wait_minutes]
      properties:
        order:
          type: array
          description: >-
            The order of service keys, first decides first (scheduling R5.8).
            Default priority, event_class, fair_share, queued_at.
          items:
            type: string
            enum: [priority, event_class, fair_share, queued_at]
        fair_share:
          type: boolean
          description: Round-robin by repository within a priority (scheduling R5.9).
        no_runner_wait_minutes:
          type: integer
          description: Minutes before "no runner with the labels" is raised (observability R5.5).
          minimum: 1
          maximum: 60
      example:
        order: [priority, event_class, fair_share, queued_at]
        fair_share: true
        no_runner_wait_minutes: 2

    # ---------- plans (repositories and runners)
    Plan:
      type: object
      description: >-
        A planned change. Nothing changes until it is applied. Each step names
        what it does; steps that delete need their own yes (UX-62).
      required: [id, area, state, created_at, created_by, steps]
      properties:
        id:
          type: string
        area:
          type: string
          enum: [repositories, runners]
        state:
          type: string
          enum: [planned, applying, done, failed, stopped, stale]
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
        steps:
          type: array
          items:
            $ref: '#/components/schemas/PlanStep'
      example:
        id: 01JCRSPPLAN0001
        area: runners
        state: planned
        created_at: '2026-11-14T10:00:00Z'
        created_by: luis-mc
        steps:
          - id: s1
            action: add_runner
            text: Add persistent runner crsp-linux-1 on machine box-1
            needs_yes: false
            state: planned
    PlanStep:
      type: object
      required: [id, action, text, needs_yes, state]
      properties:
        id:
          type: string
        action:
          type: string
          enum:
            [
              pool_on,
              pool_off,
              write_variable,
              delete_variable,
              add_runner,
              stop_old_service,
              remove_old_runner,
              delete_old_folder,
            ]
        text:
          type: string
        target:
          type: string
        needs_yes:
          type: boolean
        waits_for:
          type: string
          description: The step this one waits for, such as the new runner being online.
        state:
          type: string
          enum: [planned, running, done, failed, skipped, waiting]
        error:
          type: string
    ApplyPlanRequest:
      type: object
      required: [approved_steps]
      properties:
        approved_steps:
          type: array
          description: Ids of the steps the user said yes to.
          items:
            type: string
      example:
        approved_steps: [s1, s2]

    # ---------- machines
    MachineRecovery:
      type: object
      description: Present only when the agent of the machine needs recovery (operations R5.44, web-console R5.33).
      required: [state, reason, has, needs, since, armed]
      properties:
        state:
          type: string
          enum: [needs_recovery]
        reason:
          type: string
          enum: [old_protocol, stuck]
          description: old_protocol is an agent too old for the agent link; stuck is an agent that stayed on an old version for an hour after it was asked to update.
        has:
          type: string
          description: The version the agent runs.
        needs:
          type: string
          description: The version the controller runs.
        since:
          type: string
          format: date-time
        armed:
          type: boolean
          description: The owner pressed the action; the agent's next recovery call gets the update.
    Machine:
      type: object
      required:
        [
          id,
          name,
          os,
          arch,
          state,
          online,
          is_controller,
          backends,
          settings,
          slots_used,
          last_seen_at,
        ]
      properties:
        id:
          type: string
        name:
          type: string
        os:
          $ref: '#/components/schemas/OS'
        arch:
          $ref: '#/components/schemas/Arch'
        state:
          $ref: '#/components/schemas/MachineState'
        online:
          type: boolean
        accepting:
          type: boolean
          description: Whether the machine takes new jobs (machines R5.62). Another feature reads `online && accepting` to decide on hosted fallback. A machine that has reported nothing accepts.
        pause_reason:
          $ref: '#/components/schemas/PauseReason'
        policy:
          $ref: '#/components/schemas/MachinePolicy'
        is_controller:
          type: boolean
          description: The controller's own machine (machines R5.1); it has no special path.
        container_os:
          $ref: '#/components/schemas/OS'
          description: The operating system the machine's container engine runs containers for (machines R5.18, runners R5.47), when the engine answers. A Windows machine with Docker Desktop on WSL2 says `linux`. Absent when the engine does not answer or the agent has not reported.
        facts:
          $ref: '#/components/schemas/MachineFacts'
        backends:
          type: array
          items:
            $ref: '#/components/schemas/BackendSupport'
        settings:
          $ref: '#/components/schemas/MachineSettings'
        load:
          $ref: '#/components/schemas/Load'
        slots_used:
          type: integer
        running_jobs:
          type: array
          items:
            $ref: '#/components/schemas/Job'
        pending_change:
          $ref: '#/components/schemas/MachineChange'
        recovery:
          $ref: '#/components/schemas/MachineRecovery'
        docker_compact_status:
          $ref: '#/components/schemas/DockerCompactStatus'
        last_seen_at:
          type: string
          format: date-time
        joined_at:
          type: string
          format: date-time
      example:
        id: m_01JCRSP0001
        name: box-1
        os: linux
        arch: x64
        state: active
        online: true
        is_controller: true
        backends:
          - name: persistent
            present: true
            usable: true
            allowed: true
        settings:
          budget_memory_pct: 85
          budget_cpu_pct: 60
          job_slots: 2
          light_slots: 1
          heavy_slots: 1
          allowed_backends: [persistent]
          drain_timeout_minutes: 60
          windows_symlink_right: false
        load:
          memory_pct: 41.5
          cpu_pct: 12.0
          memory_known: true
          cpu_known: true
          sampled_at: '2026-11-14T10:00:00Z'
          stale: false
        slots_used: 1
        last_seen_at: '2026-11-14T10:00:05Z'
    MachineList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Machine'
    MachineFacts:
      type: object
      description: machines R5.10.
      properties:
        host_name:
          type: string
        os_name:
          type: string
        os_version:
          type: string
        kernel_version:
          type: string
        cpu_model:
          type: string
        cores:
          type: integer
        threads:
          type: integer
        memory_bytes:
          type: integer
          format: int64
        disk_total_bytes:
          type: integer
          format: int64
        disk_free_bytes:
          type: integer
          format: int64
        gpus:
          type: array
          items:
            type: object
            properties:
              vendor:
                type: string
              model:
                type: string
              memory_bytes:
                type: integer
                format: int64
        agent_version:
          type: string
        detected_at:
          type: string
          format: date-time
    BackendSupport:
      type: object
      description: machines R5.11 and R5.12.
      required: [name, present, usable, allowed]
      properties:
        name:
          $ref: '#/components/schemas/BackendName'
        present:
          type: boolean
        usable:
          type: boolean
        allowed:
          type: boolean
        version:
          type: string
        reason:
          type: string
          description: Why it is not usable, such as "no /dev/kvm".
        rootless:
          type: boolean
    MachineSettings:
      type: object
      description: machines R5.22, scheduling R5.1.
      required:
        [
          budget_memory_pct,
          budget_cpu_pct,
          job_slots,
          light_slots,
          heavy_slots,
          allowed_backends,
          drain_timeout_minutes,
          windows_symlink_right,
        ]
      properties:
        budget_memory_pct:
          type: integer
          minimum: 10
          maximum: 95
        budget_cpu_pct:
          type: integer
          minimum: 10
          maximum: 95
        job_slots:
          type: integer
          minimum: 0
          maximum: 64
        light_slots:
          type: integer
          minimum: 0
          maximum: 64
        heavy_slots:
          type: integer
          minimum: 0
          maximum: 64
        light_jobs:
          type: array
          items:
            type: string
        heavy_jobs:
          type: array
          items:
            type: string
        slot_max_age_minutes:
          type: integer
          minimum: 1
        gate_poll_seconds:
          type: integer
          minimum: 1
        gate_max_wait_minutes:
          type: integer
          minimum: 1
        gate_on_timeout:
          type: string
          enum: [fail, run]
        allowed_backends:
          type: array
          items:
            $ref: '#/components/schemas/BackendName'
        cache_cap_bytes:
          type: integer
          format: int64
        drain_timeout_minutes:
          type: integer
          minimum: 5
          maximum: 1440
        windows_symlink_right:
          type: boolean
          description: Owner decision for M1; grant "create symbolic links" to Windows runner accounts.
        pool_memory_gib:
          type: number
          format: double
          minimum: 0
          description: The memory in GiB the pool may use on this machine, set by the owner and checked against the load budget (machines R5.58). 0 means not set.
        pool_cpus:
          type: integer
          minimum: 0
          description: The CPUs the pool may use on this machine (machines R5.58). 0 means not set. Split over the job slots it gives CI_MAX_PARALLEL (runners R5.53).
        mode:
          $ref: '#/components/schemas/MachineMode'
        pause_on_battery:
          type: boolean
          description: Automatic pauses while the machine runs on battery. On by default; Always ignores it (machines R5.61, R5.63).
        cpu_cap_pct:
          $ref: '#/components/schemas/CpuCapPct'
        pause_until:
          type: string
          format: date-time
          description: A pause from the tray with a timer ends at this time. Absent when none runs (machines R5.61).
        pause_until_resumed:
          type: boolean
          description: A pause from the tray holds until Resume.
        docker_compact:
          $ref: '#/components/schemas/DockerCompactMode'
        docker_compact_threshold_gib:
          type: integer
          minimum: 0
          maximum: 100000
          description: How many GiB of Docker's disk file must be reclaimable (file size minus what Docker uses) before the compact runs. 0 takes 30 (caches R5.51 to R5.54).
        docker_compact_idle_minutes:
          type: integer
          minimum: 0
          maximum: 1440
          description: How many minutes no job may run or wait for the machine's runners. 0 takes 30 (caches R5.51 to R5.54).
        docker_compact_quiet_start:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Start of the quiet-hours window, in the machine's local time, as HH:MM. Empty takes 01:00 (caches R5.51 to R5.54).
        docker_compact_quiet_end:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: End of the quiet-hours window, in the machine's local time, as HH:MM. Empty takes 06:00.
    DockerCompactMode:
      type: string
      description: The automatic compact of Docker's disk file. auto (default) is on for a Windows machine with a Docker Desktop disk file and off elsewhere (caches R5.51 to R5.54).
      enum: [auto, 'on', 'off']
    DockerCompactStatus:
      type: object
      description: The Docker disk compact policy of one machine and what the agent reported about the disk file (caches R5.51 to R5.54). Read only.
      required: [enabled, running, can_compact, disk_present]
      properties:
        enabled:
          type: boolean
          description: The policy is on for this machine.
        reason:
          type: string
          description: Why the last look did not compact, or `run`. One of off, offline, not_active, no_report, no_admin, below_threshold, outside_quiet_hours, busy, not_idle_long_enough, done_today, already_running, change_open.
        running:
          type: boolean
        disk_present:
          type: boolean
          description: The agent found a Docker Desktop disk file.
        can_compact:
          type: boolean
          description: The agent has the administrator rights the compact needs.
        file_bytes:
          type: integer
          format: int64
        used_bytes:
          type: integer
          format: int64
        reclaimable_bytes:
          type: integer
          format: int64
        last_at:
          type: string
          format: date-time
        last_result:
          type: string
          description: Sizes of the last compact, or why it failed.
    MachineMode:
      type: string
      description: Automatic (default) takes jobs and pauses on battery and on a pause from the tray; Always ignores the battery; Paused takes no new job and finishes the running ones (machines R5.61).
      enum: [automatic, always, paused]
    CpuCapPct:
      type: integer
      description: The share of the whole machine's CPU the runner processes may use, in percent (machines R5.64). Separate from the load budget. 100 is no cap.
      enum: [25, 50, 75, 100]
    PauseReason:
      type: string
      description: Why a machine takes no new job (machines R5.62). Other features read these exact names.
      enum: [paused, on_battery, quiet_hours, budget, base_image_missing]
    CpuCapState:
      type: string
      description: What the agent did with the CPU cap. not_supported is macOS (machines R5.64). applying is the wait until the agent reports the result for the chosen percent.
      enum: [applied, not_supported, failed, applying]
    MachinePolicy:
      type: object
      description: What the agent last reported about the power source and the CPU cap (machines R5.62 to R5.64).
      required: [battery_known, on_battery]
      properties:
        on_battery:
          type: boolean
        battery_known:
          type: boolean
          description: False when no battery reading was possible; the machine then counts as on mains.
        cpu_cap_state:
          $ref: '#/components/schemas/CpuCapState'
        cpu_cap_detail:
          type: string
          description: Why the cap is not applied, in words fit to show.
    PoolSizeCheckRequest:
      type: object
      required: [pool_memory_gib, pool_cpus]
      properties:
        pool_memory_gib:
          type: number
          format: double
          minimum: 0
        pool_cpus:
          type: integer
          minimum: 0
      example:
        pool_memory_gib: 16
        pool_cpus: 4
    PoolSizeCheck:
      type: object
      required:
        [known, ok, needs_shrink_confirm, nearest, current_memory_gib, current_cpus]
      properties:
        known:
          type: boolean
          description: False when the controller lacks the machine figures to check; `why` says what is missing.
        why:
          type: string
        ok:
          type: boolean
          description: The size fits and, when it is a shrink, needs only the explicit yes.
        needs_shrink_confirm:
          type: boolean
          description: The size is below the current one; saving needs confirm_shrink.
        reason:
          type: string
          description: Why it is refused, naming the budget that is short.
        short:
          type: string
          enum: [floor, cpu, memory, ratio, docker]
        nearest:
          type: array
          description: Sizes that pass, as sentences.
          items:
            type: string
        total_gib:
          type: number
          format: double
        used_outside_gib:
          type: number
          format: double
        memory_budget_gib:
          type: number
          format: double
        room_gib:
          type: number
          format: double
        cpu_budget:
          type: integer
        docker_ceiling_gib:
          type: number
          format: double
        decided:
          type: string
          description: The figure that decided.
        current_memory_gib:
          type: number
          format: double
        current_cpus:
          type: integer
      example:
        known: true
        ok: true
        needs_shrink_confirm: false
        nearest: []
        total_gib: 32
        used_outside_gib: 8
        memory_budget_gib: 27.2
        room_gib: 19.2
        cpu_budget: 4
        decided: fits
        current_memory_gib: 0
        current_cpus: 0
    MachineSettingsUpdate:
      type: object
      properties:
        name:
          type: string
        budget_memory_pct:
          type: integer
          minimum: 10
          maximum: 95
        budget_cpu_pct:
          type: integer
          minimum: 10
          maximum: 95
        job_slots:
          type: integer
          minimum: 0
          maximum: 64
        light_slots:
          type: integer
          minimum: 0
          maximum: 64
        heavy_slots:
          type: integer
          minimum: 0
          maximum: 64
        light_jobs:
          type: array
          items:
            type: string
        heavy_jobs:
          type: array
          items:
            type: string
        gate_on_timeout:
          type: string
          enum: [fail, run]
        allowed_backends:
          type: array
          items:
            $ref: '#/components/schemas/BackendName'
        cache_cap_bytes:
          type: integer
          format: int64
        drain_timeout_minutes:
          type: integer
          minimum: 5
          maximum: 1440
        windows_symlink_right:
          type: boolean
        pool_memory_gib:
          type: number
          format: double
          minimum: 0
          description: The pool memory in GiB. Send it with pool_cpus. A size over the budget is refused with the budget that is short and the nearest sizes that fit (machines R5.58).
        pool_cpus:
          type: integer
          minimum: 0
          description: The pool CPUs. Send it with pool_memory_gib.
        mode:
          $ref: '#/components/schemas/MachineMode'
        pause_on_battery:
          type: boolean
        cpu_cap_pct:
          $ref: '#/components/schemas/CpuCapPct'
        docker_compact:
          $ref: '#/components/schemas/DockerCompactMode'
        docker_compact_threshold_gib:
          type: integer
          minimum: 0
          maximum: 100000
          description: How many GiB of Docker's disk file must be reclaimable (file size minus what Docker uses) before the compact runs. 0 takes 30 (caches R5.51 to R5.54).
        docker_compact_idle_minutes:
          type: integer
          minimum: 0
          maximum: 1440
          description: How many minutes no job may run or wait for the machine's runners. 0 takes 30 (caches R5.51 to R5.54).
        docker_compact_quiet_start:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Start of the quiet-hours window, in the machine's local time, as HH:MM. Empty takes 01:00 (caches R5.51 to R5.54).
        docker_compact_quiet_end:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: End of the quiet-hours window, in the machine's local time, as HH:MM. Empty takes 06:00.
        pause:
          type: string
          description: A pause from the tray or the console. one_hour pauses for an hour from now, until_resumed holds until none is sent, none ends a pause (machines R5.61).
          enum: [one_hour, until_resumed, none]
        confirm_shrink:
          type: boolean
          description: The explicit yes to a pool size below the current one. confirm does not stand for it (machines R5.58).
        confirm:
          type: boolean
          description: The yes once the jobs a restart waits for are named.
      example:
        job_slots: 3
        budget_cpu_pct: 70
    Load:
      type: object
      required: [memory_known, cpu_known, sampled_at, stale]
      properties:
        memory_pct:
          type: number
        cpu_pct:
          type: number
        memory_known:
          type: boolean
        cpu_known:
          type: boolean
        unknown_reason:
          type: string
        sampled_at:
          type: string
          format: date-time
        stale:
          type: boolean
          description: Older than 20 seconds (machines R6.7).
    LoadHistory:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [at]
            properties:
              at:
                type: string
                format: date-time
              memory_pct:
                type: number
              cpu_pct:
                type: number
    DrainRequest:
      type: object
      properties:
        reason:
          type: string
    HostCommandRequest:
      type: object
      required: [command]
      properties:
        command:
          type: array
          minItems: 1
          description: The program and its arguments; run without a shell.
          items:
            type: string
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 86400
          description: How long the command may run. Default 1800.
    HostCommandResult:
      type: object
      required: [ok, exit_code, output]
      properties:
        ok:
          type: boolean
        exit_code:
          type: integer
          description: -1 when the command did not start or was stopped.
        output:
          type: string
          description: The last 64 KiB of the combined output, redacted.
        message:
          type: string
    MachineChange:
      type: object
      description: A change that waits for a drain (machines R5.30 to R5.33).
      required: [id, machine_id, kind, state, started_at, waiting_for]
      properties:
        id:
          type: string
        machine_id:
          type: string
        kind:
          type: string
          enum:
            [
              drain,
              settings,
              remove,
              agent_update,
              controller_update,
              runner_update,
              service_restart,
              image_rebuild,
            ]
        state:
          type: string
          enum: [waiting, running, done, cancelled, needs_you]
        started_at:
          type: string
          format: date-time
        deadline_at:
          type: string
          format: date-time
        waiting_for:
          type: array
          description: Only the jobs on the runners the change touches (machines R5.57).
          items:
            $ref: '#/components/schemas/Job'
        runner_names:
          type: array
          description: The runners the change touches. Empty means every runner of the machine (machines R5.57).
          items:
            type: string
        holder:
          $ref: '#/components/schemas/DrainHolder'
        choices:
          type: array
          description: >-
            The named choices the user has now. Offered when the drain is past its
            timeout or its holder is far past its usual duration. There is never a
            choice that stops a job (machines R5.33, R5.56).
          items:
            type: string
            enum: [wait_longer, cancel]
    DrainHolder:
      type: object
      description: The job that holds a drain longest, and how long it has run (machines R5.55).
      required: [job, running_seconds, over_usual]
      properties:
        job:
          $ref: '#/components/schemas/Job'
        running_seconds:
          type: integer
        usual_seconds:
          type: integer
          description: The usual duration of this job from job history. Absent when there is no history.
        over_usual:
          type: boolean
          description: True when the job runs far past its usual duration (twice as long or more).
    MachineChangeDecision:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [wait_longer, cancel, stop_jobs]
        wait_minutes:
          type: integer
          minimum: 5
          maximum: 1440
        confirm:
          type: boolean
    CreateJoinCodeRequest:
      type: object
      properties:
        ttl_minutes:
          type: integer
          description: Default 15, ceiling 1440 (machines R5.4).
          minimum: 1
          maximum: 1440
    CreateJoinFileRequest:
      type: object
      required: [os]
      properties:
        os:
          type: string
          enum: [windows, linux, macos]
        ttl_minutes:
          type: integer
          description: Default 15, ceiling 1440 (machines R5.4).
          minimum: 1
          maximum: 1440
    SshJoinRequest:
      type: object
      required: [os, host, user, identity]
      properties:
        os:
          type: string
          enum: [linux, macos, windows]
        host:
          type: string
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: Default 22.
        user:
          type: string
        identity:
          type: string
          writeOnly: true
          description: The content of the SSH key file, used once for this join and never stored.
        host_fingerprint:
          type: string
          description: The host key fingerprint the owner confirmed (SHA256:...).
    JoinCode:
      type: object
      required: [id, state, created_at, expires_at]
      properties:
        id:
          type: string
        state:
          type: string
          enum: [waiting, joined, expired, revoked]
        progress:
          type: string
          enum: [waiting, connected, ready]
          description: >-
            How far a copied or SSH join got (RES3). `waiting`: no agent used the
            code yet. `connected`: the agent joined. `ready`: the machine sent
            its first heartbeat. Absent once the code expired or was withdrawn.
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        machine_id:
          type: string
          description: Set once an agent joined with it.
    JoinCodeCreated:
      type: object
      required: [code, join_code, commands]
      properties:
        code:
          type: string
          description: The one-time code, shown once.
        join_code:
          $ref: '#/components/schemas/JoinCode'
        commands:
          $ref: '#/components/schemas/InstallCommands'
    InstallCommands:
      type: object
      required: [controller_address, agent_port, cert_sha256, items]
      properties:
        controller_address:
          type: string
          example: pool.lan
        agent_port:
          type: integer
          example: 8461
        cert_sha256:
          type: string
          description: The controller certificate fingerprint the agent pins.
        items:
          type: array
          items:
            type: object
            required: [os, command]
            properties:
              os:
                $ref: '#/components/schemas/OS'
              command:
                type: string
    PoolSettings:
      type: object
      required:
        [
          budget_memory_pct,
          budget_cpu_pct,
          size_slots_from_machine,
          default_job_slots,
          drain_timeout_minutes,
        ]
      properties:
        budget_memory_pct:
          type: integer
          minimum: 10
          maximum: 95
        budget_cpu_pct:
          type: integer
          minimum: 10
          maximum: 95
        size_slots_from_machine:
          type: boolean
          description: Size a new machine's slots from its cores and memory within the budget.
        default_job_slots:
          type: integer
          minimum: 0
          maximum: 64
        drain_timeout_minutes:
          type: integer
          minimum: 5
          maximum: 1440
      example:
        budget_memory_pct: 85
        budget_cpu_pct: 60
        size_slots_from_machine: true
        default_job_slots: 2
        drain_timeout_minutes: 60

    # ---------- runners
    Runner:
      type: object
      required:
        [
          id,
          name,
          machine_id,
          machine_name,
          os,
          arch,
          kind,
          backend,
          isolation,
          labels,
          scope,
          state,
          managed,
          keeps_state,
        ]
      properties:
        id:
          type: string
        name:
          type: string
        machine_id:
          type: string
        machine_name:
          type: string
          description: The name of the machine, as the Machines list shows it (UX-1).
        reason:
          type: string
          description: Why the runner is in a state that is not idle or busy (UX-19). Absent when there is nothing to say.
        os:
          $ref: '#/components/schemas/OS'
        arch:
          $ref: '#/components/schemas/Arch'
        kind:
          $ref: '#/components/schemas/RunnerKind'
        backend:
          $ref: '#/components/schemas/BackendName'
        isolation:
          $ref: '#/components/schemas/Isolation'
        labels:
          type: array
          items:
            type: string
        scope:
          $ref: '#/components/schemas/RunnerScope'
        runner_version:
          type: string
        state:
          $ref: '#/components/schemas/RunnerState'
        managed:
          type: boolean
          description: False for a runner not made by CRSP (runners R5.5).
        keeps_state:
          type: boolean
          description: True for a persistent runner (runners R5.7, UX-61).
        failed_reason:
          type: string
          description: Whole plain reason the runner is in the failed state, with what the clean-up left behind. Only present when state is failed.
        github_runner_id:
          type: integer
          format: int64
        current_job:
          $ref: '#/components/schemas/Job'
        created_at:
          type: string
          format: date-time
      example:
        id: r_01JCRSP0001
        name: crsp-linux-1
        machine_id: m_01JCRSP0001
        os: linux
        arch: x64
        kind: persistent
        backend: persistent
        isolation: persistent
        labels: [self-hosted, linux, x64]
        scope:
          kind: repository
          repository_id: 700100
        runner_version: 2.330.0
        state: idle
        managed: true
        keeps_state: true
    RunnerScope:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [repository, organization]
        repository_id:
          type: integer
          format: int64
        organization:
          type: string
        runner_group:
          type: string
    RunnerList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Runner'
    PlanRunnersRequest:
      type: object
      required: [os, kind, machine_id, count, scope]
      properties:
        os:
          $ref: '#/components/schemas/OS'
        kind:
          $ref: '#/components/schemas/RunnerKind'
        machine_id:
          type: string
        count:
          type: integer
          minimum: 1
          maximum: 64
        labels:
          type: array
          items:
            type: string
        scope:
          $ref: '#/components/schemas/RunnerScope'
      example:
        os: linux
        kind: persistent
        machine_id: m_01JCRSP0001
        count: 2
        labels: [self-hosted, linux, x64]
        scope:
          kind: repository
          repository_id: 700100

    # ---------- jobs, slots, live
    Job:
      type: object
      description: One job attempt (observability R5.7, R5.8).
      required:
        [id, repository, run_id, run_attempt, github_job_id, job_name, state, labels]
      properties:
        id:
          type: integer
          format: int64
        repository:
          type: string
        repository_id:
          type: integer
          format: int64
        run_id:
          type: integer
          format: int64
        run_attempt:
          type: integer
        github_job_id:
          type: integer
          format: int64
        workflow:
          type: string
        job_name:
          type: string
        head_sha:
          type: string
        trigger:
          type: string
        labels:
          type: array
          items:
            type: string
        state:
          type: string
          enum: [queued, running, done]
        wait_reason:
          $ref: '#/components/schemas/WaitReason'
        wait_text:
          type: string
          description: The reason with its machine, numbers or labels.
        machine_id:
          type: string
        runner_id:
          type: string
        runner_name:
          type: string
        backend:
          type: string
        isolation:
          $ref: '#/components/schemas/Isolation'
        created_at:
          type: string
          format: date-time
        queued_at:
          type: string
          format: date-time
        slot_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        github_wait_seconds:
          type: integer
        slot_wait_seconds:
          type: integer
        run_seconds:
          type: integer
        result:
          $ref: '#/components/schemas/JobResult'
        html_url:
          type: string
      example:
        id: 1
        repository: luis-mc/app
        repository_id: 700100
        run_id: 11223344
        run_attempt: 1
        github_job_id: 81234567
        workflow: ci.yml
        job_name: test
        labels: [self-hosted, linux, x64]
        state: queued
        wait_reason: free_slot
        wait_text: waits for a free slot on box-1 (2 of 2 taken)
    JobPage:
      type: object
      required: [items, stale]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Job'
        next_cursor:
          type: string
        stale:
          $ref: '#/components/schemas/Staleness'
    Slot:
      type: object
      required: [kind, number, taken_at, repository, run_id, run_attempt, job]
      properties:
        kind:
          type: string
          enum: [ci, light, heavy]
        number:
          type: integer
        taken_at:
          type: string
          format: date-time
        repository:
          type: string
        run_id:
          type: integer
          format: int64
        run_attempt:
          type: integer
        job:
          type: string
        runner_id:
          type: string
        stale_reason:
          type: string
    Ticket:
      type: object
      required: [id, repository, run_id, run_attempt, job, queued_at, place]
      properties:
        id:
          type: string
        repository:
          type: string
        run_id:
          type: integer
          format: int64
        run_attempt:
          type: integer
        job:
          type: string
        priority:
          type: integer
        event_class:
          type: integer
        queued_at:
          type: string
          format: date-time
        beat_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        place:
          type: integer
          description: 1 is first in line.
        wait_reason:
          $ref: '#/components/schemas/WaitReason'
    SlotStatus:
      type: object
      required: [machine_id, slots, tickets]
      properties:
        machine_id:
          type: string
        slots:
          type: array
          items:
            $ref: '#/components/schemas/Slot'
        tickets:
          type: array
          items:
            $ref: '#/components/schemas/Ticket'
    FreeSlotsRequest:
      type: object
      properties:
        slots:
          type: array
          description: Live slots to free by hand; needs confirm.
          items:
            type: object
            required: [kind, number]
            properties:
              kind:
                type: string
                enum: [ci, light, heavy]
              number:
                type: integer
        confirm:
          type: boolean
    FreedSlotList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [slot, reason]
            properties:
              slot:
                $ref: '#/components/schemas/Slot'
              reason:
                type: string
    WaitingJob:
      type: object
      description: One queued or held job with the first reason it waits (scheduling R5.48).
      required: [job_id, repository, job_name, reason, words]
      properties:
        job_id:
          type: integer
          format: int64
        repository:
          type: string
        job_name:
          type: string
        machine_id:
          type: string
        reason:
          $ref: '#/components/schemas/WaitReason'
        words:
          type: string
          description: The reason in words, with its numbers (memory 91% > 85%, 2 ahead in the queue).
    Overview:
      type: object
      required: [machines, queued_count, running, last_event_id]
      properties:
        machines:
          type: array
          items:
            $ref: '#/components/schemas/Machine'
        queued_count:
          type: integer
        queued:
          type: array
          items:
            $ref: '#/components/schemas/Job'
        waiting:
          type: array
          description: >-
            Why each queued or held job waits, in words, first blocking reason
            only, in the order of the queue (scheduling R5.48, web-console R5.20).
          items:
            $ref: '#/components/schemas/WaitingJob'
        running:
          type: array
          items:
            $ref: '#/components/schemas/Job'
        minutes_saved_today:
          type: array
          description: Per OS (observability R5.15).
          items:
            type: object
            required: [os, minutes]
            properties:
              os:
                $ref: '#/components/schemas/OS'
              minutes:
                type: integer
        last_event_id:
          type: string
          description: Open the stream with this as Last-Event-ID.
    LiveEvent:
      type: object
      description: >-
        One event of the stream (observability 7, live stream). `data` holds
        the field of the matching type; the others are absent.
      required: [id, type, at]
      properties:
        id:
          type: string
        type:
          type: string
          enum:
            [
              snapshot,
              job.queued,
              job.waiting,
              job.started,
              job.finished,
              machine.load,
              machine.state,
              runner.state,
              saved.today,
              doctor.progress,
              plan.progress,
              change.progress,
              image.state,
              cache.state,
              update.status,
            ]
        at:
          type: string
          format: date-time
        replay_gap:
          type: boolean
          description: True on a snapshot sent because missed events were no longer kept (R5.3).
        snapshot:
          $ref: '#/components/schemas/Overview'
        job:
          $ref: '#/components/schemas/Job'
        machine:
          $ref: '#/components/schemas/Machine'
        load:
          type: object
          required: [machine_id, load]
          properties:
            machine_id:
              type: string
            load:
              $ref: '#/components/schemas/Load'
            slots_used:
              type: integer
        runner:
          $ref: '#/components/schemas/Runner'
        doctor_run:
          $ref: '#/components/schemas/DoctorRun'
        plan:
          $ref: '#/components/schemas/Plan'
        change:
          $ref: '#/components/schemas/MachineChange'
        image:
          $ref: '#/components/schemas/Image'
        cache:
          $ref: '#/components/schemas/Cache'
        update:
          $ref: '#/components/schemas/UpdateStatus'
      example:
        id: '1042'
        type: machine.load
        at: '2026-11-14T10:00:05Z'
        load:
          machine_id: m_01JCRSP0001
          load:
            memory_pct: 41.5
            cpu_pct: 12
            memory_known: true
            cpu_known: true
            sampled_at: '2026-11-14T10:00:05Z'
            stale: false
          slots_used: 1

    # ---------- doctor
    DoctorScope:
      type: object
      properties:
        machines:
          type: array
          items:
            type: string
        repositories:
          type: array
          items:
            type: integer
            format: int64
        checks:
          type: array
          items:
            type: string
    DoctorRun:
      type: object
      description: doctor 7.4.
      required: [id, trigger, state, started_at, counts, findings]
      properties:
        id:
          type: string
        trigger:
          type: string
          enum: [web, cli, schedule, system]
        state:
          type: string
          enum: [running, done, failed]
        scope:
          $ref: '#/components/schemas/DoctorScope'
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        worst:
          $ref: '#/components/schemas/Severity'
        counts:
          type: object
          additionalProperties:
            type: integer
        findings:
          type: array
          items:
            $ref: '#/components/schemas/DoctorFinding'
    DoctorFinding:
      type: object
      required: [check, subject, severity, title, fix, needs_admin, milestone, checked_at]
      properties:
        check:
          type: string
          example: workflow.labels
        subject:
          type: object
          required: [kind, id, name]
          properties:
            kind:
              type: string
            id:
              type: string
            name:
              type: string
        severity:
          $ref: '#/components/schemas/Severity'
        title:
          type: string
        detail:
          type: string
        fix:
          type: object
          required: [text]
          properties:
            text:
              type: string
            command:
              type: string
            link:
              type: string
        needs_admin:
          type: boolean
        milestone:
          type: integer
        checked_at:
          type: string
          format: date-time
      example:
        check: workflow.labels
        subject:
          kind: repository
          id: '700100'
          name: luis-mc/app
        severity: fail
        title: No online runner carries [self-hosted, linux, arm64]
        detail: .github/workflows/ci.yml:12 needs [self-hosted, linux, arm64]
        fix:
          text: Add a runner with these labels, or use fromJSON(vars.RUNS_ON_LINUX).
          link: /runners
        needs_admin: false
        milestone: 1
        checked_at: '2026-11-14T10:00:12Z'
    DoctorFindingList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DoctorFinding'
        last_run_at:
          type: string
          format: date-time

    # ---------- settings and audit
    Settings:
      type: object
      description: observability R6.8 retention (days unless named), operations R5.21 backup time.
      properties:
        retention_job_history_days:
          type: integer
          minimum: 7
          maximum: 400
        retention_logs_days:
          type: integer
          minimum: 1
          maximum: 90
        retention_logs_mib_per_machine:
          type: integer
          minimum: 64
          maximum: 10240
        retention_audit_days:
          type: integer
          minimum: 90
          maximum: 1825
        retention_load_raw_hours:
          type: integer
          minimum: 1
          maximum: 168
        backup_time_local:
          type: string
          description: HH:MM, 24-hour local time.
          example: '03:00'
        backup_keep_days:
          type: integer
          minimum: 1
          maximum: 365
        max_event_streams:
          type: integer
          minimum: 1
          maximum: 200
        fallback_grace_minutes:
          type: integer
          minimum: 1
          maximum: 60
          description: github-integration R5.43. How long no crsp machine of an operating system must have been up before a repository that turned the hosted fallback on runs on GitHub-hosted runners. Default 3.
        auto_update:
          type: boolean
          description: operations R5.15. On by default. When on, a newer stable release installs by itself after a drain. When off, the console Review step asks first.
      example:
        retention_job_history_days: 90
        retention_logs_days: 14
        retention_logs_mib_per_machine: 512
        retention_audit_days: 400
        retention_load_raw_hours: 24
        backup_time_local: '03:00'
        backup_keep_days: 14
        max_event_streams: 50
        fallback_grace_minutes: 3
        auto_update: true
    UpdateStatus:
      type: object
      description: operations R5.11 to R5.18, tray R5.18.
      required: [current_version, update_available, state, auto_update, running_jobs]
      properties:
        current_version:
          type: string
          example: 1.4.0
        latest_version:
          type: string
          description: The newest stable release found; absent before the first look.
        update_available:
          type: boolean
        state:
          type: string
          enum:
            [
              idle,
              checking,
              waiting_for_jobs,
              downloading,
              installing,
              restarting,
              failed,
            ]
          description: waiting_for_jobs is the drain. failed carries `error`.
        auto_update:
          type: boolean
        checked_at:
          type: string
          format: date-time
        error:
          type: string
          description: Which check or step failed, in words.
        running_jobs:
          type: array
          description: Jobs running on this machine that the drain waits for.
          items:
            $ref: '#/components/schemas/UpdateJob'
        drain_timeout_minutes:
          type: integer
        release_url:
          type: string
          format: uri
      example:
        current_version: 1.4.0
        latest_version: 1.5.0
        update_available: true
        state: idle
        auto_update: true
        running_jobs: []
    UpdateJob:
      type: object
      required: [repository, run_id, job]
      properties:
        repository:
          type: string
        workflow:
          type: string
        run_id:
          type: integer
          format: int64
        job:
          type: string
    AuditEvent:
      type: object
      description: observability R5.24.
      required: [id, at, actor, source, action, target_type, target_id, summary, result]
      properties:
        id:
          type: integer
          format: int64
        at:
          type: string
          format: date-time
        actor:
          type: string
          description: GitHub login, `system`, or the machine for agent actions.
        actor_id:
          type: string
        source:
          type: string
          enum: [web, cli, tray, api, agent, system]
        action:
          type: string
          example: machine.drain
        target_type:
          type: string
        target_id:
          type: string
        summary:
          type: string
          description: Short before-and-after summary; redacted.
        result:
          type: string
          enum: [done, refused]
      example:
        id: 77
        at: '2026-11-14T10:00:00Z'
        actor: luis-mc
        actor_id: '583231'
        source: web
        action: machine.drain
        target_type: machine
        target_id: m_01JCRSP0001
        summary: state active -> draining
        result: done
    AuditPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        next_cursor:
          type: string

    # ---------- backups
    Backup:
      type: object
      required: [id, file, created_at, state]
      properties:
        id:
          type: string
        file:
          type: string
          example: crsp-backup-2026-11-14-0300.tar.gz
        created_at:
          type: string
          format: date-time
        size_bytes:
          type: integer
          format: int64
        schema_version:
          type: integer
          format: int64
        state:
          type: string
          enum: [writing, good, failed]
        check_result:
          type: string
          description: PRAGMA integrity_check result.
    BackupList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Backup'
        last_drill:
          $ref: '#/components/schemas/BackupDrill'
    BackupDrill:
      type: object
      required: [id, started_at, state]
      properties:
        id:
          type: string
        backup_id:
          type: string
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        state:
          type: string
          enum: [running, passed, failed]
        detail:
          type: string

    # ---------- images and caches (CRSP32)
    ImageTool:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: node
        version:
          type: string
          example: '26'
    LayerNeededBy:
      type: object
      description: The repositories on the machine that ask for a layer (LOOK12).
      required: [count, repositories, failing]
      properties:
        count:
          type: integer
        repositories:
          type: array
          items:
            type: string
          description: Full names of the repositories.
        failing:
          type: integer
          description: Repositories whose recent job failed for lack of the layer.
    ImageExtraPackages:
      type: object
      required: [repository, packages]
      properties:
        repository:
          type: string
        packages:
          type: array
          items:
            type: string
    ImageLayer:
      type: object
      required: [id, name, enabled, size_bytes, adds, purpose, needed_by]
      properties:
        adds:
          type: array
          description: The tools the layer adds to the base.
          items:
            $ref: '#/components/schemas/ImageTool'
        purpose:
          type: string
          description: One line, completes "Pick it when".
        needed_by:
          $ref: '#/components/schemas/LayerNeededBy'
        id:
          type: string
          example: browsers
        name:
          type: string
          example: Browsers for Playwright
        enabled:
          type: boolean
        size_bytes:
          type: integer
          format: int64
    Image:
      type: object
      description: One image on one machine (runners R5.32 and R5.33).
      required:
        [
          id,
          machine_id,
          os,
          base,
          base_tools,
          extra_packages,
          layers,
          size_bytes,
          state,
          newest,
        ]
      properties:
        base_tools:
          type: array
          description: What every image on the machine holds, always.
          items:
            $ref: '#/components/schemas/ImageTool'
        extra_packages:
          type: array
          description: Extra packages per repository on the machine.
          items:
            $ref: '#/components/schemas/ImageExtraPackages'
        id:
          type: string
        machine_id:
          type: string
        os:
          $ref: '#/components/schemas/OS'
        base:
          type: string
          description: The base image.
          example: ubuntu-24.04
        layers:
          type: array
          items:
            $ref: '#/components/schemas/ImageLayer'
        size_bytes:
          type: integer
          format: int64
        built_at:
          type: string
          format: date-time
        newest:
          type: boolean
          description: True for the newest image kept for this machine and OS.
        needs_rebuild:
          type: boolean
          description: The saved layers differ from the built ones.
        state:
          type: string
          enum: [ready, rebuilding, failed, not_built]
        error:
          type: string
          description: Why the last build failed; the old image keeps serving.
      example:
        id: img_01JCRSP0001
        machine_id: m_01JCRSP0001
        os: linux
        base: ubuntu-24.04
        base_tools:
          - name: Ubuntu
            version: '24.04'
          - name: git
        extra_packages:
          - repository: luis-mc/app
            packages: [libssl-dev]
        layers:
          - id: kvm
            name: KVM virtual machines
            enabled: true
            size_bytes: 612368384
            adds:
              - name: qemu-system-x86_64
            purpose: your jobs boot a virtual machine with qemu
            needed_by:
              count: 1
              repositories: [luis-mc/app]
              failing: 0
        size_bytes: 2147483648
        built_at: '2026-11-13T22:00:00Z'
        newest: true
        needs_rebuild: false
        state: ready
    ImageList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Image'
    UpdateImageLayersRequest:
      type: object
      required: [enabled_layers]
      properties:
        enabled_layers:
          type: array
          description: Ids of the layers that are on. Every other layer is off.
          items:
            type: string
      example:
        enabled_layers: [build-tools, browsers]
    CacheKind:
      type: string
      description: >-
        `tool_cache` and `rust_cache` are the per-runner folders of milestone 1
        (caches R5.36, R5.39); the others arrive with later milestones.
      enum: [actions_cache, git_mirror, tool_cache, registry_mirror, rust_cache]
    Cache:
      type: object
      description: One cache on one machine (caches R5.8 to R5.14).
      required: [id, kind, machine_id, size_bytes, state]
      properties:
        id:
          type: string
        kind:
          $ref: '#/components/schemas/CacheKind'
        machine_id:
          type: string
        runner_id:
          type: string
          description: The runner whose folder this is, for a per-runner cache.
        runner_name:
          type: string
          description: The runner's name, for a per-runner cache.
        size_bytes:
          type: integer
          format: int64
        cap_bytes:
          type: integer
          format: int64
          description: Absent when the cache has no cap.
        entry_count:
          type: integer
        last_wiped_at:
          type: string
          format: date-time
        state:
          type: string
          enum: [ready, wiping]
        waiting_for:
          type: array
          description: The running jobs a wiping cache waits for (caches R5.32).
          items:
            type: string
        error:
          type: string
          description: Why the last wipe failed; nothing more was deleted.
      example:
        id: cch_01JCRSP0001
        kind: tool_cache
        machine_id: m_01JCRSP0001
        size_bytes: 3221225472
        cap_bytes: 10737418240
        entry_count: 42
        state: ready
    CacheList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Cache'

    # ---------- notifications (CRSP32)
    NotificationEvent:
      type: string
      description: The stable event types of notifications R5.1.
      enum:
        [
          machine.offline,
          job.waiting,
          disk.low,
          runner.outdated,
          doctor.finding,
          update.available,
        ]
    NotificationKind:
      type: string
      enum: [email, webhook, desktop]
    NotificationSeverity:
      type: string
      description: The lowest doctor severity the channel gets (notifications R5.4).
      enum: [info, warning, error]
    SmtpSettings:
      type: object
      description: How an email channel sends. The password is never returned.
      required: [host, port, has_password]
      properties:
        host:
          type: string
        port:
          type: integer
        username:
          type: string
        from:
          type: string
        has_password:
          type: boolean
    NotificationChannel:
      type: object
      description: >-
        One channel. No secret is returned: `secret_set` and `smtp.has_password`
        say only whether one is set.
      required: [id, kind, name, scope, enabled, events, min_severity, secret_set]
      properties:
        id:
          type: string
        kind:
          $ref: '#/components/schemas/NotificationKind'
        name:
          type: string
        scope:
          type: string
          enum: [personal, pool]
          description: Email and desktop are personal; a webhook is pool-wide.
        enabled:
          type: boolean
        events:
          type: array
          items:
            $ref: '#/components/schemas/NotificationEvent'
        min_severity:
          $ref: '#/components/schemas/NotificationSeverity'
        address:
          type: string
          description: Email address (kind email).
        url:
