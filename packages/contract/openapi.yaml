            application/json:
              schema:
                $ref: '#/components/schemas/MachineChange'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/join-codes:
    post:
      operationId: createJoinCode
      tags: [machines]
      summary: Make a one-time join code and the install commands
      description: >-
        machines R5.3 to R5.6 (M1 by owner decision). The code shows once, in
        this answer only. A new code makes the old unused one invalid.
      x-auth: admin
      x-rate-limit: 10/minute/user
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJoinCodeRequest'
      responses:
        '201':
          description: The code and the commands that carry it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinCodeCreated'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/join-files:
    post:
      operationId: createJoinFile
      tags: [machines]
      summary: Download an installer file with a one-time join code built in
      description: >-
        machines R5.65 (CRSP122, owner decision D70). Makes a join code (R5.4: it
        works once and lives 15 minutes by default; an older unused code becomes
        invalid) and answers a file for the machine's OS: a `.cmd` for Windows, a
        `.sh` for Linux, a `.command` for macOS. The file holds the controller
        address, the certificate fingerprint, the code and the SHA-256 of the
        release packages, and nothing else secret. The file name says the OS and
        the expiry. `X-Join-Code-Id` is the id to poll with getJoinCode. The audit
        entry never holds the code. 501 when this controller has no release
        packages to hand out (a development build).
      x-auth: admin
      x-rate-limit: 10/minute/user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJoinFileRequest'
      responses:
        '201':
          description: The installer file.
          headers:
            Content-Disposition:
              required: true
              schema:
                type: string
              example: attachment; filename="crsp-join-linux-until-20261114T1215Z.sh"
            X-Join-Code-Id:
              required: true
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Error'
  /api/v1/packages/{name}:
    get:
      operationId: getPackage
      x-cli: none
      x-cli-reason: 'Fetched by the installer file on the new machine, not by a person.'
      tags: [machines]
      summary: A release package, or SHA256SUMS
      description: >-
        machines R5.65. The release packages this controller was built from
        (installers and SHA256SUMS), checked against SHA256SUMS before they are
        served. Public data, like the GitHub release; only names the release lists
        are served. The installer file checks the SHA-256 itself.
      x-auth: public
      x-rate-limit: 30/minute/ip
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: The package.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Error'
  /api/v1/join-codes/ssh:
    post:
      operationId: joinMachineOverSsh
      x-cli: none
      x-cli-reason: 'Later: remaining console screens get commands in their own task (cli open question 7).'
      tags: [machines]
      summary: Join a Linux, macOS or Windows machine over SSH
      description: >-
        machines R5.3a (RES3, owner decision D59; Windows with OpenSSH server, CRSP123, D70: the SSH user must be an administrator). The optional path beside
        copy-and-wait. The key file in `identity` is used for this one join and
        is never stored or logged; there is no password option. Without
        `host_fingerprint` nothing runs: the answer is 409 `needs_confirmation`
        whose detail is the host key fingerprint to confirm; send the call again
        with it. The answer is the join code record (never its value); poll it
        like a copied command.
      x-auth: admin
      x-rate-limit: 10/minute/user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SshJoinRequest'
      responses:
        '201':
          description: The command ran on the machine; its join code is waiting for the agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinCode'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/join-codes/{joinCodeId}:
    get:
      operationId: getJoinCode
      x-cli: none
      x-cli-reason: 'Later: remaining console screens get commands in their own task (cli open question 7).'
      tags: [machines]
      summary: A join code's state (never its value)
      description: web-console R5.17. The wizard polls until joined, expired or withdrawn.
      x-auth: admin
      x-rate-limit: 600/minute/user
      parameters:
        - $ref: '#/components/parameters/JoinCodeId'
      responses:
