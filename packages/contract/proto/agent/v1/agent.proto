syntax = "proto3";

package agent.v1;

option go_package = "github.com/luis-mc/ci-runners-pool/internal/gen/agent/v1;agentv1";

// AgentService is the link from an agent to its controller. The agent dials out;
// the controller never connects in.
service AgentService {
  // Register enrols an agent. Placeholder shape: the real fields land with the
  // enrolment design in milestone 1.
  rpc Register(RegisterRequest) returns (RegisterResponse);

  // Session is the long-lived bidirectional stream between agent and controller.
  rpc Session(stream SessionRequest) returns (stream SessionResponse);
}

message RegisterRequest {
  string agent_name = 1;
  string os = 2;
  string arch = 3;
}

message RegisterResponse {
  string agent_id = 1;
}

message SessionRequest {
  oneof message {
    Heartbeat heartbeat = 1;
    LoadReport load_report = 2;
  }
}

message SessionResponse {
  oneof message {
    Heartbeat heartbeat = 1;
  }
}

message Heartbeat {
  int64 sent_at_unix_ms = 1;
}

// LoadReport is a placeholder; the measured fields are decided with the scheduler.
message LoadReport {
  int64 sampled_at_unix_ms = 1;
}
